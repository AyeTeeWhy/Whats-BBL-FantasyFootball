<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --field: #161E1A;
    --field-2: #212B24;
    --field-3: #34463A;
    --chalk: #EFEAF7;
    --chalk-dim: #9A91B0;
    --amber: #CBA135;
    --amber-dim: #8F7326;
    --turf-line: rgba(224,232,220,0.12);
    --loss-red: #C1667A;
    --win-green: #7CB88F;
    --ink: #16121C;
    --glow-1: rgba(203,161,53,0.14);
    --glow-2: rgba(90,150,110,0.18);
    --accent-2: rgba(110,180,135,0.5);
    --radius: 6px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--field);
    background-image:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 64px);
    color: var(--chalk);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  /* ---------- HERO ---------- */
  header.hero {
    padding: 56px 0 36px;
    border-bottom: 1px solid var(--turf-line);
    position: relative;
    overflow: hidden;
  }
  header.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% -10%, var(--glow-1), transparent 50%),
      radial-gradient(ellipse at 85% 10%, var(--glow-2), transparent 55%);
    pointer-events: none;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 10px;
  }
  .league-switcher-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .league-switcher {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    background: var(--field-2);
    color: var(--chalk);
    border: 1px solid var(--turf-line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .league-switcher:hover { border-color: rgba(203,161,53,0.5); }
  .league-switcher:focus { outline: none; border-color: var(--amber); }
  h1.league-name {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: clamp(38px, 6vw, 64px);
    line-height: 0.95;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    text-transform: uppercase;
  }
  .league-sub {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--chalk-dim);
    font-size: 13px;
  }

  .scoreboard-strip {
    margin-top: 32px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--turf-line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--field-2);
  }
  .sb-cell {
    padding: 16px 18px;
    border-right: 1px solid var(--turf-line);
  }
  .sb-cell:last-child { border-right: none; }
  .sb-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 6px;
  }
  .sb-value {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: 22px;
    color: var(--amber);
    text-transform: uppercase;
    line-height: 1.1;
  }
  .sb-value small { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--chalk-dim); }

  /* ---------- YARD-LINE SEASON NAV ---------- */
  nav.yardline {
    margin: 34px 0 0;
    position: relative;
    padding-top: 6px;
  }
  .yardline-track {
    display: flex;
    align-items: flex-end;
    gap: 0;
    border-bottom: 2px solid var(--turf-line);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .yard-tick {
    flex: 1 0 auto;
    min-width: 64px;
    text-align: center;
    padding: 0 4px 12px;
    cursor: pointer;
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    position: relative;
    transition: color 0.15s ease;
  }
  .yard-tick::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 8px;
    background: var(--turf-line);
  }
  .yard-tick.active { color: var(--amber); font-weight: 700; }
  .yard-tick.active::after { background: var(--amber); height: 14px; width: 3px; bottom: -2px; }
  .yard-tick:hover:not(.active) { color: var(--chalk); }
  .yard-tick .dot {
    display: none;
  }
  .yard-tick.no-data { opacity: 0.45; }

  /* ---------- CONTENT ---------- */
  main { padding: 36px 0 80px; }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h2.panel-title {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    text-transform: uppercase;
    font-size: 24px;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--chalk);
  }
  .panel-note { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--chalk-dim); }

  table.standings {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  table.standings thead th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    padding: 0 14px 10px;
    border-bottom: 1px solid var(--turf-line);
    font-weight: 400;
  }
  table.standings thead th.num, table.standings td.num { text-align: right; }
  th.sortable {
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th.sortable:hover { color: var(--chalk); }
  th.sortable.active-sort { color: var(--amber); }
  .sort-arrow { font-size: 8px; margin-left: 3px; display: inline-block; }
  table.standings tbody tr {
    border-bottom: 1px solid rgba(243,239,226,0.06);
  }
  table.standings tbody tr:nth-child(odd) { background: rgba(255,255,255,0.015); }
  table.standings tbody tr:hover { background: rgba(203,161,53,0.08); }
  table.standings td {
    padding: 12px 14px;
    vertical-align: middle;
  }
  td.rank {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    color: var(--amber-dim);
    font-size: 16px;
    width: 34px;
  }
  tr:first-child td.rank { color: var(--amber); }
  td.team-name { font-weight: 600; }
  td.owner { color: var(--chalk-dim); font-size: 12.5px; }
  td.num { font-family: 'IBM Plex Mono', monospace; }
  .record-w { color: var(--win-green); }
  .record-l { color: var(--loss-red); }
  .streak-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid var(--turf-line);
  }

  .placeholder-box {
    border: 1px dashed var(--turf-line);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    color: var(--chalk-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
  }
  .placeholder-box strong { color: var(--amber); display: block; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 18px; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.02em;}

  .loading-row { color: var(--chalk-dim); font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 24px 0; }

  footer {
    border-top: 1px solid var(--turf-line);
    padding: 20px 0 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--chalk-dim);
    text-align: center;
  }

  /* ---------- VIEW TOGGLE ---------- */
  .view-toggle {
    display: inline-flex;
    margin-top: 30px;
    border: 1px solid var(--turf-line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .toggle-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: transparent;
    color: var(--chalk-dim);
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    border-right: 1px solid var(--turf-line);
  }
  .toggle-btn:last-child { border-right: none; }
  .toggle-btn.active { background: var(--amber); color: var(--ink); font-weight: 700; }
  .toggle-btn:hover:not(.active) { color: var(--chalk); }

  /* ---------- SEASON SUB-TABS ---------- */
  .sub-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 4px 0 20px;
  }
  .sub-tab-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--field-2);
    color: var(--chalk-dim);
    border: 1px solid var(--turf-line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .sub-tab-btn:hover:not(.active) { color: var(--chalk); border-color: var(--accent-2); }
  .sub-tab-btn.active { color: var(--ink); background: var(--amber); border-color: var(--amber); font-weight: 700; }

  .roster-refresh-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .roster-refresh-row .panel-note { flex: 1 1 320px; }
  .refresh-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    background: var(--field-2);
    color: var(--chalk);
    border: 1px solid var(--turf-line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease;
  }
  .refresh-btn:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }

  /* ---------- HISTORICAL STATS ---------- */
  #historyView { padding: 36px 0 80px; }
  .hist-section { margin-bottom: 44px; }
  .hist-section-head {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    text-transform: uppercase;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: var(--chalk);
    margin: 0 0 4px;
  }
  .hist-section-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--chalk-dim);
    margin: 0 0 14px;
  }

  .money-pos { color: var(--win-green); }
  .money-neg { color: var(--loss-red); }
  .prize-cell small { display: block; color: var(--chalk-dim); font-size: 11px; }
  .prize-cell.empty { color: var(--chalk-dim); }
  .hist-subhead {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    text-transform: uppercase; font-size: 15px; letter-spacing: 0.04em;
    color: var(--chalk); margin: 22px 0 8px;
  }
  .prize-summary {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--chalk-dim);
    margin: 0 0 12px; line-height: 1.6;
  }
  .prize-summary b { color: var(--chalk); font-weight: 600; }

  .record-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 44px;
  }
  .record-card {
    border: 1px solid var(--turf-line);
    border-radius: var(--radius);
    background: var(--field-2);
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }
  .record-card:hover { border-color: rgba(203,161,53,0.4); }
  .record-card-highlight {
    border-color: var(--amber);
    background: linear-gradient(160deg, var(--field-2), var(--field-3) 220%);
  }
  .record-card-highlight .rc-name { font-size: 26px; }
  .record-card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--amber), var(--field-3) 130%);
  }
  .record-card .rc-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 8px;
  }
  .record-card .rc-name {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: 22px;
    text-transform: uppercase;
    color: var(--amber);
    line-height: 1.15;
  }
  .record-card .rc-detail {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--chalk-dim);
    margin-top: 4px;
  }

  table.hist-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.hist-table thead th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--turf-line);
    font-weight: 400;
  }
  table.hist-table thead th.num, table.hist-table td.num { text-align: right; }
  table.hist-table tbody tr { border-bottom: 1px solid rgba(243,239,226,0.06); }
  table.hist-table tbody tr:nth-child(odd) { background: rgba(255,255,255,0.015); }
  table.hist-table tbody tr:hover { background: rgba(203,161,53,0.08); }
  table.hist-table td { padding: 10px 12px; vertical-align: middle; }
  table.hist-table td.num { font-family: 'IBM Plex Mono', monospace; }
  table.hist-table td.rank {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    color: var(--amber-dim);
    font-size: 15px;
    width: 30px;
  }
  table.hist-table tr:first-child td.rank { color: var(--amber); }
  .trophy-count {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--amber);
  }
  .years-list { color: var(--chalk-dim); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  .table-scroll { width: 100%; overflow-x: auto; }

  /* ---------- ROSTERS VIEW ---------- */
  .rv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
    align-items: start;
  }
  .rv-card {
    border: 1px solid var(--turf-line);
    border-radius: var(--radius);
    background: var(--field-2);
    overflow: hidden;
  }
  .rv-card summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .rv-card summary::-webkit-details-marker { display: none; }
  .rv-team {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    text-transform: uppercase;
    font-size: 18px;
    line-height: 1.1;
  }
  .rv-owner { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--chalk-dim); margin-top: 3px; }
  .rv-record { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--amber); white-space: nowrap; }
  .rv-body { padding: 0 16px 12px; border-top: 1px solid var(--turf-line); }
  .rv-pos {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin: 12px 0 4px;
  }
  .rv-player {
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr) auto auto;
    gap: 8px;
    align-items: baseline;
    padding: 4px 0;
    font-size: 13px;
    border-bottom: 1px solid rgba(239,234,247,0.05);
  }
  .rv-star { color: var(--amber); font-size: 11px; }
  .rv-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rv-nfl { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--chalk-dim); }
  .rv-val { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--amber); min-width: 28px; text-align: right; }
  .rv-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.05em;
    padding: 1px 5px;
    margin-left: 6px;
    border-radius: 3px;
    border: 1px solid var(--loss-red);
    color: var(--loss-red);
    vertical-align: middle;
  }
  .rv-tag-ir { border-color: var(--chalk-dim); color: var(--chalk-dim); }

  /* ---------- WEEKLY MATCHUPS ---------- */
  .matchup-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 20px;
    align-items: start;
  }
  .whatif-panel {
    position: sticky;
    top: 16px;
    border: 1px solid var(--turf-line);
    border-radius: var(--radius);
    background: var(--field-2);
    padding: 16px 16px 8px;
  }
  .wi-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .wi-title {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    text-transform: uppercase;
    font-size: 18px;
    margin: 0;
  }
  .wi-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    line-height: 1.5;
    color: var(--chalk-dim);
    margin: 6px 0 10px;
  }
  .wi-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .wi-table tr { border-bottom: 1px solid rgba(239,234,247,0.06); }
  .wi-table td { padding: 7px 4px; vertical-align: middle; }
  .wi-rank { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; color: var(--amber-dim); width: 22px; font-size: 15px; }
  .wi-move { font-family: 'IBM Plex Mono', monospace; font-size: 11px; width: 34px; }
  .wi-flat { color: var(--chalk-dim); }
  .wi-team { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .wi-rec, .wi-status { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; white-space: nowrap; text-align: right; }
  .wi-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--turf-line);
  }
  .wi-tag-in { color: var(--win-green); border-color: var(--win-green); }
  .wi-tag-out { color: var(--loss-red); border-color: var(--loss-red); }
  .pick-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: transparent;
    color: var(--chalk-dim);
    border: 1px solid var(--turf-line);
    border-radius: 999px;
    padding: 5px 14px;
    margin-top: 10px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .pick-btn:hover:not(.selected) { color: var(--chalk); border-color: var(--amber); }
  .pick-btn.selected { background: var(--amber); border-color: var(--amber); color: var(--ink); font-weight: 700; }
  .pick-btn.lost { opacity: 0.55; }
  .matchup-grid { display: flex; flex-direction: column; gap: 16px; }
  .matchup-card {
    border: 1px solid var(--turf-line);
    border-radius: var(--radius);
    background: var(--field-2);
    padding: 20px 22px;
  }
  .matchup-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
  }
  .matchup-team { text-align: center; }
  .matchup-team .mt-name {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: 19px;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .matchup-team .mt-owner {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--chalk-dim);
    margin-top: 3px;
  }
  .matchup-team .mt-record {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--amber);
    margin-top: 6px;
  }
  .matchup-vs {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    color: var(--chalk-dim);
    font-size: 20px;
  }
  .matchup-headline {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--turf-line);
    text-align: center;
    font-size: 13px;
    color: var(--chalk-dim);
  }
  .matchup-implications {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 14px;
    text-align: center;
  }
  .mi-col {
    font-size: 12.5px;
    color: var(--chalk-dim);
    border-top: 1px solid var(--turf-line);

   ========================================================= */
async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("Request failed: " + url);
  return res.json();
}

// Sleeper's /state/nfl "week" field tracks the *preseason* week
// during preseason (season_type "pre"), not the fantasy week -- so
// trusting it blindly before the season starts pulls whatever
// preseason-numbered week happens to match, which can land on a
// completely different (and already-scheduled) fantasy week's
// matchups. Fantasy weeks only mean anything once the regular
// season (or postseason) is underway; anything else is week 1.
// How many teams make the playoffs. A league can pin this explicitly
// (playoffSpotsOverride) when Sleeper's own setting doesn't match how
// the league actually plays; otherwise it comes from Sleeper.
function getPlayoffSpots(entry) {
  if (CONFIG.playoffSpotsOverride) return CONFIG.playoffSpotsOverride;
  const s = entry && entry.leagueMeta && entry.leagueMeta.settings;
  return (s && s.playoff_teams) || 6;
}

function currentFantasyWeek(nflState) {
  if (!nflState) return 1;
  if (nflState.season_type === "regular" || nflState.season_type === "post") {
    return nflState.week || 1;
  }
  return 1;
}

async function buildSeasonChain() {
  const chain = [];
  let leagueId = CONFIG.currentLeagueId;
  let guard = 0;
  while (leagueId && leagueId !== "0" && guard < 25) {
    guard++;
    let league;
    try {
      league = await getJSON(`${API}/league/${leagueId}`);
    } catch (e) {
      break;
    }
    chain.push({ season: parseInt(league.season, 10), leagueId, source: "sleeper", leagueMeta: league });
    leagueId = league.previous_league_id;
  }
  chain.sort((a, b) => a.season - b.season);

  // Fill in any pre-Sleeper seasons from historical data / placeholders
  const earliestSleeperSeason = chain.length ? chain[0].season : new Date().getFullYear();
  for (let yr = CONFIG.earliestTrackedSeason; yr < earliestSleeperSeason; yr++) {
    if (HISTORICAL_DATA[yr]) {
      chain.unshift({ season: yr, source: "historical" });
    } else {
      chain.unshift({ season: yr, source: "missing" });
    }
  }
  chain.sort((a, b) => a.season - b.season);
  return chain;
}

const PLAYER_VALUE_MAP = {};
PLAYER_RANKS_2026.forEach(([rank, name]) => {
  PLAYER_VALUE_MAP[name.toLowerCase()] = 100 * Math.pow(0.977, rank - 1);
});
function playerValue(name) {
  if (!name) return 0.4; // unranked/undrafted player floor value
  return PLAYER_VALUE_MAP[name.toLowerCase()] ?? 0.4;
}

function canonicalOwner(name) {
  if (!name) return name;
  // Case-insensitive lookup — Sleeper usernames get typed/remembered
  // with inconsistent casing, so match loosely rather than requiring
  // an exact-case key in OWNER_ALIASES.
  if (OWNER_ALIASES[name]) return OWNER_ALIASES[name];
  const lower = name.toLowerCase();
  for (const key in OWNER_ALIASES) {
    if (key.toLowerCase() === lower) return OWNER_ALIASES[key];
  }
  return name;
}

async function computeSleeperStandings(entry) {
  const { leagueId } = entry;
  const [users, rosters] = await Promise.all([
    getJSON(`${API}/league/${leagueId}/users`),
    getJSON(`${API}/league/${leagueId}/rosters`)
  ]);
  const userMap = {};
  users.forEach(u => { userMap[u.user_id] = u; });

  const teams = rosters.map(r => {
    const u = userMap[r.owner_id] || {};
    const teamName = (u.metadata && u.metadata.team_name) || u.display_name || "Unknown Team";
    const s = r.settings || {};
    return {
      owner: canonicalOwner(u.display_name || "Unknown"),
      teamName,
      wins: s.wins || 0,
      losses: s.losses || 0,
      ties: s.ties || 0,
      pointsFor: ((s.fpts || 0) + (s.fpts_decimal || 0) / 100),
      pointsAgainst: ((s.fpts_against || 0) + (s.fpts_against_decimal || 0) / 100),
      streak: s.streak || null
    };
  });

  teams.sort((a, b) => {
    if (b.wins !== a.wins) return b.wins - a.wins;
    return b.pointsFor - a.pointsFor;
  });

  return teams;
}

function getHistoricalStandings(season) {
  const data = HISTORICAL_DATA[season];
  if (!data || !data.teams) return null;
  const teams = data.teams.slice().sort((a, b) => {
    if (a.rank != null && b.rank != null) return a.rank - b.rank;
    if (b.wins !== a.wins) return (b.wins || 0) - (a.wins || 0);
    return (b.pointsFor || 0) - (a.pointsFor || 0);
  });
  return teams;
}

/* =========================================================
   GENERIC SORTABLE TABLE
   columns: [{ key, label, numeric, render(row, i) => cell HTML }]
   ========================================================= */
function paintSortableTable(container, columns, rows, cellHTML, defaultKey, defaultDir) {
  let sortKey = defaultKey;
  let dir = defaultDir || "desc";

  function getSorted() {
    return rows.slice().sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (typeof va === "string" || typeof vb === "string") {
        va = (va == null ? "" : String(va)).toLowerCase();
        vb = (vb == null ? "" : String(vb)).toLowerCase();
        if (va < vb) return dir === "asc" ? -1 : 1;
        if (va > vb) return dir === "asc" ? 1 : -1;
        return 0;
      }
      va = va == null ? -Infinity : va;
      vb = vb == null ? -Infinity : vb;
      return dir === "asc" ? va - vb : vb - va;
    });
  }

  function paint() {
    const theadHTML = `<tr>
      <th></th>
      ${columns.map(c => `
        <th class="${c.numeric ? "num " : ""}sortable${c.key === sortKey ? " active-sort" : ""}" data-key="${c.key}">
          ${c.label}${c.key === sortKey ? `<span class="sort-arrow">${dir === "asc" ? "\u25B2" : "\u25BC"}</span>` : ""}
        </th>`).join("")}
    </tr>`;
    const sortedRows = getSorted();
    const tbodyHTML = sortedRows.map((row, i) => cellHTML(row, i)).join("") ||
      `<tr><td colspan="${columns.length + 1}">No data yet.</td></tr>`;

    container.innerHTML = `<table class="hist-table sortable-table"><thead>${theadHTML}</thead><tbody>${tbodyHTML}</tbody></table>`;
    container.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (key === sortKey) {
          dir = dir === "asc" ? "desc" : "asc";
        } else {
          sortKey = key;
          dir = columns.find(c => c.key === key).numeric ? "desc" : "asc";
        }
        paint();
      });
    });
  }
  paint();
}

  ];

  paintSortableTable(
    document.getElementById("content"),

    rows,
    (t, i) => {
      const diffClass = t.diff >= 0 ? "record-w" : "record-l";
      const diffStr = (t.diff >= 0 ? "+" : "") + t.diff.toFixed(1);

  );
}

/* =========================================================
   ROSTER RANKINGS
   Scores each team's actual current roster against the 2026 PPR
   value table above, using the league's real starting lineup
   requirements to separate starter strength from bench depth.
   ========================================================= */
// ---------------------------------------------------------------
// LIVE IN-SEASON PLAYER VALUES
// Replaces the static preseason rankings with real season-to-date
// fantasy points once games have actually been played, computed
// from Sleeper's own weekly stats using the league's real scoring
// settings (so it matches this league's actual PPR rules exactly,
// not a generic assumption). Players who haven't recorded a game
// yet fall back to the preseason rank so the tool stays usable
// early in the season and for byes/injuries. Cached per season;
// pass forceRefresh to recompute from scratch.
// ---------------------------------------------------------------
async function buildLiveValueMap(entry, forceRefresh) {
  const season = entry.season;
  state.subCache[season] = state.subCache[season] || {};
  if (state.subCache[season].liveValueMap && !forceRefresh) {
    return state.subCache[season].liveValueMap;
  }

  const result = { map: {}, weekUsed: 0, live: false, weeksWithData: 0, error: false };
  try {
    const league = entry.leagueMeta || await getJSON(`${API}/league/${entry.leagueId}`);
    const scoringSettings = league.scoring_settings || {};
    const nflState = await getJSON(`${API}/state/nfl`);
    const currentWeek = currentFantasyWeek(nflState);

    if (!state.playersStatic) {
      state.playersStatic = await getJSON(`${API}/players/nfl`);
    }
    const playersDb = state.playersStatic;

    const totalPoints = {};
    const gamesPlayed = {};
    let weeksWithData = 0;

    for (let wk = 1; wk <= currentWeek; wk++) {
      let weekStats;
      try {
        weekStats = await getJSON(`${API}/stats/nfl/regular/${season}/${wk}`);
      } catch (e) { continue; }
      if (!weekStats || !Object.keys(weekStats).length) continue;

      let anyRealStats = false;
      Object.entries(weekStats).forEach(([pid, stats]) => {
        if (!stats || typeof stats !== "object") return;
        const keys = Object.keys(stats);
        if (!keys.length) return;
        let pts = 0;
        keys.forEach(k => {
          const mult = scoringSettings[k];
          if (mult) pts += (stats[k] || 0) * mult;
        });
        totalPoints[pid] = (totalPoints[pid] || 0) + pts;
        gamesPlayed[pid] = (gamesPlayed[pid] || 0) + 1;
        anyRealStats = true;
      });
      if (anyRealStats) weeksWithData++;
    }

    const livePpg = [];
    Object.keys(totalPoints).forEach(pid => {
      const gp = gamesPlayed[pid] || 0;
      if (gp <= 0) return;
      const p = playersDb[pid];
      if (!p || !["QB", "RB", "WR", "TE"].includes(p.position)) return;
      const name = [p.first_name, p.last_name].filter(Boolean).join(" ");
      if (!name) return;
      livePpg.push({ name, ppg: totalPoints[pid] / gp });
    });
    livePpg.sort((a, b) => b.ppg - a.ppg);

    // Unified ranking: proven performers first (by points per game
    // actually scored), then anyone who hasn't played yet in their
    // original preseason order -- same decay curve applied to
    // whichever ranking is in effect, so the scale never mismatches.
    const seen = new Set(livePpg.map(p => p.name.toLowerCase()));
    const unified = livePpg.map(p => p.name);
    PLAYER_RANKS_2026.forEach(([rank, name]) => {
      const key = name.toLowerCase();
      if (!seen.has(key)) { unified.push(name); seen.add(key); }
    });

    const map = {};
    unified.forEach((name, i) => { map[name.toLowerCase()] = 100 * Math.pow(0.977, i); });

    result.map = map;
    result.weekUsed = currentWeek;
    result.weeksWithData = weeksWithData;
    result.live = weeksWithData > 0;
  } catch (e) {
    result.map = PLAYER_VALUE_MAP;
    result.live = false;
    result.error = true;
  }

  state.subCache[season].liveValueMap = result;
  return result;
}

function valueFromMap(map, name) {
  if (!name) return 0.4;
  return map[name.toLowerCase()] ?? 0.4;
}

async function renderRosterRankings(entry, forceRefresh) {
  const content = document.getElementById("content");
  const season = entry.season;
  state.subCache[season] = state.subCache[season] || {};

  if (forceRefresh) {
    state.subCache[season].roster = null;
    state.subCache[season].liveValueMap = null;
  }

  if (!state.subCache[season].roster) {
    try {
      const league = entry.leagueMeta || await getJSON(`${API}/league/${entry.leagueId}`);
      const [users, rosters, valueResult] = await Promise.all([
        getJSON(`${API}/league/${entry.leagueId}/users`),
        getJSON(`${API}/league/${entry.leagueId}/rosters`),
        buildLiveValueMap(entry, forceRefresh)
      ]);

      // The full NFL player database is ~5MB and only needed here
      // (to map roster player_ids to names) -- fetch once and hold
      // in memory for the session rather than per-team.
      if (!state.playersStatic) {
        state.playersStatic = await getJSON(`${API}/players/nfl`);
      }
      const playersDb = state.playersStatic;
      const valueMap = valueResult.map;

      const userMap = {};
      users.forEach(u => { userMap[u.user_id] = u; });

      const slots = (league.roster_positions || []).filter(p => p !== "BN" && p !== "IR" && p !== "TAXI");
      const starterSlotCounts = {};
      slots.forEach(s => { starterSlotCounts[s] = (starterSlotCounts[s] || 0) + 1; });

      const teams = rosters.map(r => {
        const u = userMap[r.owner_id] || {};
        const owner = canonicalOwner(u.display_name || "Unknown");
        const teamName = (u.metadata && u.metadata.team_name) || u.display_name || "Unknown Team";

        const players = (r.players || []).map(pid => {
          const p = playersDb[pid];
          const name = p ? [p.first_name, p.last_name].filter(Boolean).join(" ") : null;
          const position = p ? p.position : "?";
          return { name: name || "Unknown", position, value: valueFromMap(valueMap, name) };
        }).filter(p => ["QB", "RB", "WR", "TE"].includes(p.position));

        // Greedily fill required starter slots with the highest-value
        // eligible player left, position-specific slots first, then
        // FLEX/SUPER_FLEX/WRRB/etc with whatever's left over -- this
        // mirrors how a manager would actually set their lineup.
        const pool = players.slice().sort((a, b) => b.value - a.value);
        const used = new Set();
        let starterValue = 0;
        const posEligibility = {
          QB: ["QB"], RB: ["RB"], WR: ["WR"], TE: ["TE"],
          FLEX: ["RB", "WR", "TE"], WRRB_FLEX: ["RB", "WR"], REC_FLEX: ["WR", "TE"],
          SUPER_FLEX: ["QB", "RB", "WR", "TE"]
        };
        const slotOrder = Object.keys(starterSlotCounts).sort((a, b) => {
          const width = k => (posEligibility[k] || ["QB", "RB", "WR", "TE"]).length;
          return width(a) - width(b);
        });
        slotOrder.forEach(slotKey => {
          const count = starterSlotCounts[slotKey];
          const eligible = posEligibility[slotKey] || ["QB", "RB", "WR", "TE"];
          for (let i = 0; i < count; i++) {
            const pick = pool.find(p => !used.has(p) && eligible.includes(p.position));
            if (pick) { used.add(pick); starterValue += pick.value; }
          }
        });
        const benchValue = pool.filter(p => !used.has(p)).reduce((s, p) => s + p.value, 0);

        const byPos = { QB: 0, RB: 0, WR: 0, TE: 0 };
        players.forEach(p => { byPos[p.position] += p.value; });
        const bestPlayer = pool[0] || null;

        return {
          owner, teamName,
          rosterScore: starterValue + benchValue * 0.15,
          starterValue, benchValue,
          byPos, bestPlayer,
          playerCount: players.length
        };
      });

      state.subCache[season].roster = teams;
      state.subCache[season].rosterValueInfo = valueResult;
    } catch (e) {
      state.subCache[season].roster = null;
    }
  }

  const teams = state.subCache[season].roster;

  if (teams === null) {
    content.innerHTML = `<div class="placeholder-box"><strong>Couldn't load rosters</strong>Check your connection and try again.</div>`;
    return;
  }
  if (!teams.length) {
    content.innerHTML = `<div class="placeholder-box"><strong>No rosters yet</strong>Rosters for ${season} aren't set.</div>`;
    return;
  }

  const ranked = teams.slice().sort((a, b) => b.rosterScore - a.rosterScore);

  // ---- Tidbits: strongest/weakest position groups league-wide ----
  const posTotals = { QB: [], RB: [], WR: [], TE: [] };
  ranked.forEach(t => Object.keys(posTotals).forEach(pos => posTotals[pos].push({ owner: t.owner, val: t.byPos[pos] })));
  const bestAt = pos => posTotals[pos].slice().sort((a, b) => b.val - a.val)[0];
  const worstAt = pos => posTotals[pos].slice().sort((a, b) => a.val - b.val)[0];

  const tidbits = [
    `<strong>${escapeHTML(ranked[0].owner)}</strong> has the strongest roster on paper, powered by ${escapeHTML(ranked[0].bestPlayer ? ranked[0].bestPlayer.name : "a deep group")} and a well-rounded lineup.`,
    `Best QB room: <strong>${escapeHTML(bestAt("QB").owner)}</strong>. Best RB room: <strong>${escapeHTML(bestAt("RB").owner)}</strong>. Best WR corps: <strong>${escapeHTML(bestAt("WR").owner)}</strong>. Best TE situation: <strong>${escapeHTML(bestAt("TE").owner)}</strong>.`,
    `Thinnest spots to watch: <strong>${escapeHTML(worstAt("RB").owner)}</strong> at RB and <strong>${escapeHTML(worstAt("WR").owner)}</strong> at WR could be hunting the waiver wire early.`,
    `<strong>${escapeHTML(ranked[ranked.length - 1].owner)}</strong> ranks last in roster strength right now &mdash; not a death sentence this early, but worth monitoring through waivers.`
  ];

  const valueInfo = state.subCache[season].rosterValueInfo || { live: false, weekUsed: 0 };
  const freshnessNote = valueInfo.live
    ? `Live through Week ${valueInfo.weekUsed} &mdash; players who haven't recorded a game yet still use preseason rank.`
    : `Preseason rankings &mdash; no games played yet this season.`;

  content.innerHTML = `
    <div class="roster-refresh-row">
      <p class="panel-note" style="display:block;">Scores each team's actual roster using real season stats where available, preseason rank as fallback &mdash; starters count in full, bench depth counts partially. Click any column to sort.</p>
      <button class="refresh-btn" id="rosterRefreshBtn" title="Re-pull rosters and recompute from the latest stats">&#8635; Refresh</button>
    </div>
    <p class="panel-note" style="margin-bottom:14px;display:block;">${freshnessNote}</p>
    <div class="table-scroll" id="rosterRankTable" style="margin-bottom:20px;"></div>
    <div class="hist-section" style="margin-bottom:0;">
      <h2 class="hist-section-head" style="font-size:17px;">Notes</h2>
      <ul style="margin:0; padding-left:18px; color:var(--chalk-dim); font-size:13.5px; line-height:1.9;">
        ${tidbits.map(t => `<li>${t}</li>`).join("")}
      </ul>
    </div>
  `;
  document.getElementById("rosterRefreshBtn").addEventListener("click", async (e) => {
    e.target.disabled = true;
    e.target.textContent = "Refreshing\u2026";
    await renderRosterRankings(entry, true);
  });

  paintSortableTable(
    document.getElementById("rosterRankTable"),
    [
      { key: "teamName", label: "Team" },
      { key: "owner", label: "Owner" },
      { key: "rosterScore", label: "Roster Score", numeric: true },
      { key: "starterValue", label: "Starters", numeric: true },
      { key: "benchValue", label: "Bench", numeric: true },
      { key: "bestPlayerName", label: "Top Player" }
    ],
    ranked.map(t => ({ ...t, bestPlayerName: t.bestPlayer ? t.bestPlayer.name : "\u2014" })),
    (t, i) => `
      <tr>
        <td class="rank">${i + 1}</td>
        <td class="team-name">${escapeHTML(t.teamName)}</td>
        <td class="owner">${escapeHTML(t.owner)}</td>
        <td class="num" style="color: var(--amber); font-family: 'IBM Plex Mono', monospace;">${t.rosterScore.toFixed(1)}</td>
        <td class="num">${t.starterValue.toFixed(1)}</td>
        <td class="num">${t.benchValue.toFixed(1)}</td>
        <td class="team-name">${escapeHTML(t.bestPlayerName)}</td>
      </tr>`,
    "rosterScore", "desc"
  );
}

/* =========================================================
   IN-SEASON POWER RANKINGS
   ========================================================= */
async function renderInSeasonPowerRankings(entry) {
  const content = document.getElementById("content");
  const season = entry.season;
  state.subCache[season] = state.subCache[season] || {};

  if (!state.subCache[season].power) {
    try {
      const [users, rosters, nflState] = await Promise.all([
        getJSON(`${API}/league/${entry.leagueId}/users`),
        getJSON(`${API}/league/${entry.leagueId}/rosters`),
        getJSON(`${API}/state/nfl`)
      ]);
      const userMap = {};
      users.forEach(u => { userMap[u.user_id] = u; });
      const rosterOwner = {};
      const rosterTeamName = {};
      rosters.forEach(r => {
        const u = userMap[r.owner_id] || {};
        rosterOwner[r.roster_id] = canonicalOwner(u.display_name || "Unknown");
        rosterTeamName[r.roster_id] = (u.metadata && u.metadata.team_name) || u.display_name || "Unknown Team";
      });

      const currentWeek = currentFantasyWeek(nflState);
      const perRoster = {};
      Object.keys(rosterOwner).forEach(rid => {
        perRoster[rid] = { rosterId: rid, owner: rosterOwner[rid], teamName: rosterTeamName[rid], weekly: [], wins: 0, losses: 0, ties: 0 };
      });

      let weeksPlayed = 0;
      for (let wk = 1; wk <= currentWeek; wk++) {
        let matchups;
        try {
          matchups = await getJSON(`${API}/league/${entry.leagueId}/matchups/${wk}`);
        } catch (e) {
          continue;
        }
        if (!matchups || !matchups.length) continue;
        const anyPoints = matchups.some(m => (m.points || 0) > 0);
        if (!anyPoints) continue;
        weeksPlayed++;

        const byMatchup = {};
        matchups.forEach(m => {
          if (m.matchup_id == null) return;
          byMatchup[m.matchup_id] = byMatchup[m.matchup_id] || [];
          byMatchup[m.matchup_id].push(m);
        });

        matchups.forEach(m => {
          if (!perRoster[m.roster_id]) return;
          perRoster[m.roster_id].weekly.push(m.points || 0);
        });

        Object.values(byMatchup).forEach(pair => {
          if (pair.length !== 2) return;
          const [a, b] = pair;
          if (!perRoster[a.roster_id] || !perRoster[b.roster_id]) return;
          if ((a.points || 0) > (b.points || 0)) {
            perRoster[a.roster_id].wins++;
            perRoster[b.roster_id].losses++;
          } else if ((a.points || 0) < (b.points || 0)) {
            perRoster[b.roster_id].wins++;
            perRoster[a.roster_id].losses++;
          } else {
            perRoster[a.roster_id].ties++;
            perRoster[b.roster_id].ties++;
          }
        });
      }

      state.subCache[season].power = { weeksPlayed, rosters: Object.values(perRoster) };
    } catch (e) {
      state.subCache[season].power = null;
    }
  }

  const data = state.subCache[season].power;

  if (data === null) {
    content.innerHTML = `<div class="placeholder-box"><strong>Couldn't load weekly scores</strong>Check your connection and try again.</div>`;
    return;
  }
  if (!data.weeksPlayed) {
    content.innerHTML = `<div class="placeholder-box"><strong>Season hasn't kicked off yet</strong>Power rankings for ${season} will populate once games start counting.</div>`;
    return;
  }

  const rows = data.rosters
    .filter(r => r.weekly.length)
    .map(r => {
      const games = r.weekly.length;
      const total = r.weekly.reduce((s, p) => s + p, 0);
      const avg = total / games;
      const last3 = r.weekly.slice(-3);
      const recentForm = last3.reduce((s, p) => s + p, 0) / last3.length;
      const gp = r.wins + r.losses + r.ties;
      const winPct = gp ? (r.wins + r.ties * 0.5) / gp : 0;
      return { owner: r.owner, teamName: r.teamName, wins: r.wins, losses: r.losses, ties: r.ties, winPct, avg, recentForm, total };
    });

  const range = arr => ({ min: Math.min(...arr), max: Math.max(...arr) });
  const normalize = (v, min, max) => max === min ? 100 : (v - min) / (max - min) * 100;
  const wpR = range(rows.map(r => r.winPct));
  const avgR = range(rows.map(r => r.avg));
  const formR = range(rows.map(r => r.recentForm));
  const diffR = range(rows.map(r => r.avg)); // proxy: uses scoring range again for stability when no PA tracked weekly here

  const ranked = rows.map(r => {
    const score =
      normalize(r.winPct, wpR.min, wpR.max) * 0.30 +
      normalize(r.avg, avgR.min, avgR.max) * 0.25 +
      normalize(r.recentForm, formR.min, formR.max) * 0.25 +
      normalize(r.avg, diffR.min, diffR.max) * 0.20;
    return { ...r, score };
  }).sort((a, b) => b.score - a.score);

  content.innerHTML = `<p class="panel-note" style="margin-bottom:14px;display:block;">Through ${data.weeksPlayed} week${data.weeksPlayed !== 1 ? "s" : ""} &middot; blends win % (30%), scoring average (25%), last-3-week form (25%), and week-to-week diff (20%)</p><div class="table-scroll" id="inSeasonPowerTable"></div>`;

  paintSortableTable(
    document.getElementById("inSeasonPowerTable"),
    [
      { key: "teamName", label: "Team" },
      { key: "owner", label: "Owner" },
      { key: "score", label: "Power Score", numeric: true },
      { key: "wins", label: "Record", numeric: true },
      { key: "avg", label: "Avg Pts", numeric: true },
      { key: "recentForm", label: "Last 3 Avg", numeric: true }
    ],
    ranked,
    (r, i) => `
      <tr>
        <td class="rank">${i + 1}</td>
        <td class="team-name">${escapeHTML(r.teamName)}</td>
        <td class="owner">${escapeHTML(r.owner)}</td>
        <td class="num" style="color: var(--amber); font-family: 'IBM Plex Mono', monospace;">${r.score.toFixed(1)}</td>
        <td class="num"><span class="record-w">${r.wins}</span>-<span class="record-l">${r.losses}</span>${r.ties ? "-" + r.ties : ""}</td>
        <td class="num">${r.avg.toFixed(1)}</td>
        <td class="num">${r.recentForm.toFixed(1)}</td>
      </tr>`,
    "score", "desc"
  );
}

/* =========================================================
   PLAYOFF PICTURE
   ========================================================= */
function computePlayoffOrder(teams, playoffSpots) {
  const sorted = teams.slice().sort((a, b) => (b.wins - a.wins) || (b.pointsFor - a.pointsFor));
  const cutoffTeam = sorted[playoffSpots - 1];
  return sorted.map((t, i) => {
    const inPlayoffs = i < playoffSpots;
    let back = "\u2014";
    if (!inPlayoffs && cutoffTeam) {
      const winsBack = cutoffTeam.wins - t.wins;
      back = winsBack > 0 ? `${winsBack.toFixed(1)} game${winsBack !== 1 ? "s" : ""}` : `${(cutoffTeam.pointsFor - t.pointsFor).toFixed(1)} pts`;
    }
    return { ...t, rank: i + 1, status: inPlayoffs ? "In" : "Out", back, isCutoff: i === playoffSpots - 1 };
  });
}

function simulateResult(teams, ownerKey, delta, playoffSpots) {
  const simulated = teams.map(t => t.owner === ownerKey
    ? { ...t, wins: t.wins + (delta.wins || 0), losses: t.losses + (delta.losses || 0) }
    : t);
  const order = computePlayoffOrder(simulated, playoffSpots);
  const me = order.find(t => t.owner === ownerKey);
  return me;
}

/* =========================================================
   PLAYOFF ODDS (Monte Carlo simulation)
   Simulates the rest of the season thousands of times using each
   team's current scoring average, and reports what share of those
   simulations end with them inside the playoff cutoff.
   ========================================================= */
function gaussianRandom(mean, stddev) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  return mean + z * stddev;
}

// Magic-number style numbers per team. "certain" flags only use
// airtight bounds (nothing a simulation could get wrong); the win
// targets come from the simulated seasons.
function buildCushion(teams, gamesLeft, spots, clinchK, aliveK) {
  const out = {};
  teams.forEach(t => {
    const R = gamesLeft[t.owner] || 0;
    const maxWins = t.wins + R;
    const others = teams.filter(o => o.owner !== t.owner);
    // Eliminated for sure: enough other teams already have more wins
    // than this team could possibly finish with.
    const aboveForSure = others.filter(o => o.wins > maxWins).length;
    // Clinched for sure: so few other teams can even match this
    // team's current win total that they can't fill every spot.
    const canReach = others.filter(o => o.wins + (gamesLeft[o.owner] || 0) >= t.wins).length;
    let cert = null;
    if (aboveForSure >= spots) cert = "eliminated";
    else if (canReach <= spots - 1) cert = "clinched";

    let lockNeed = null;
    if (clinchK != null) {
      const need = Math.max(0, clinchK - t.wins);
      lockNeed = need <= R ? need : null;
    }
    let canLose = aliveK != null ? R - Math.max(0, aliveK - t.wins) : R;
    if (cert === "clinched") lockNeed = 0;
    if (cert === "eliminated") canLose = -1;
    out[t.owner] = { gamesLeft: R, lockNeed, canLose, cert };
  });
  return out;
}

async function computePlayoffOdds(entry, playoffSpots) {
  const [users, rosters, nflState] = await Promise.all([
    getJSON(`${API}/league/${entry.leagueId}/users`),
    getJSON(`${API}/league/${entry.leagueId}/rosters`),
    getJSON(`${API}/state/nfl`)
  ]);
  const userMap = {};
  users.forEach(u => { userMap[u.user_id] = u; });

  const teamsByRoster = {};
  rosters.forEach(r => {
    const u = userMap[r.owner_id] || {};
    const s = r.settings || {};
    const wins = s.wins || 0, losses = s.losses || 0, ties = s.ties || 0;
    const pointsFor = (s.fpts || 0) + (s.fpts_decimal || 0) / 100;
    const gp = wins + losses + ties;
    teamsByRoster[r.roster_id] = {
      rosterId: r.roster_id,
      owner: canonicalOwner(u.display_name || "Unknown"),
      teamName: (u.metadata && u.metadata.team_name) || u.display_name || "Unknown Team",
      wins, losses, ties, pointsFor,
      avgPoints: gp ? pointsFor / gp : null,
      weekly: []
    };
  });
  const known = Object.values(teamsByRoster).filter(t => t.avgPoints != null).map(t => t.avgPoints);
  const leagueAvg = known.length ? known.reduce((a, b) => a + b, 0) / known.length : 100;
  Object.values(teamsByRoster).forEach(t => { if (t.avgPoints == null) t.avgPoints = leagueAvg; });

  const currentWeek = currentFantasyWeek(nflState);
  const league = entry.leagueMeta || {};
  const lastRegularWeek = (league.settings && league.settings.playoff_week_start) ? league.settings.playoff_week_start - 1 : 14;

  // Pull each team's actual weekly scores for completed weeks so the
  // simulation can weight recent form the same way the in-season
  // Power Rankings do, rather than treating Week 1 the same as last
  // week's performance.
  for (let wk = 1; wk < currentWeek; wk++) {
    let wkMatchups;
    try { wkMatchups = await getJSON(`${API}/league/${entry.leagueId}/matchups/${wk}`); } catch (e) { continue; }
    if (!wkMatchups || !wkMatchups.length) continue;
    const anyPoints = wkMatchups.some(m => (m.points || 0) > 0);
    if (!anyPoints) continue;
    wkMatchups.forEach(m => {
      if (teamsByRoster[m.roster_id]) teamsByRoster[m.roster_id].weekly.push(m.points || 0);
    });
  }
  Object.values(teamsByRoster).forEach(t => {
    const last3 = t.weekly.slice(-3);
    const recentForm = last3.length ? last3.reduce((a, b) => a + b, 0) / last3.length : null;
    // Blend season-long average with recent form (same "hot/cold"
    // signal the in-season Power Rankings use) so a team's projected
    // performance reflects how they're playing lately, not just their
    // average across the whole season so far.
    t.projectedMean = recentForm != null ? (t.avgPoints * 0.5 + recentForm * 0.5) : t.avgPoints;
  });

  const remainingWeeksMatchups = [];
  for (let wk = currentWeek; wk <= lastRegularWeek; wk++) {
    let m;
    try { m = await getJSON(`${API}/league/${entry.leagueId}/matchups/${wk}`); } catch (e) { continue; }
    if (!m || !m.length) continue;
    const byMatchup = {};
    m.forEach(x => {
      if (x.matchup_id == null) return;
      byMatchup[x.matchup_id] = byMatchup[x.matchup_id] || [];
      byMatchup[x.matchup_id].push(x.roster_id);
    });
    const pairs = Object.values(byMatchup).filter(p => p.length === 2);
    if (pairs.length) remainingWeeksMatchups.push(pairs);
  }

  const odds = {};
  if (!remainingWeeksMatchups.length) {
    // No remaining schedule found (season over, or not yet published) --
    // odds collapse to simply whether a team is currently in or out.
    const order = computePlayoffOrder(Object.values(teamsByRoster), playoffSpots);
    order.forEach(t => { odds[t.owner] = t.status === "In" ? 100 : 0; });
    const cushion = buildCushion(Object.values(teamsByRoster), {}, playoffSpots, null, null);
    return { odds, simulated: false, weeksRemaining: 0, cushion, clinchWins: null, aliveWins: null };
  }

  // Each simulated game draws a score for both teams from a normal
  // distribution around their season scoring average (assumed ~18%
  // week-to-week variance, a reasonable rule of thumb for fantasy
  // scoring rather than a measured value for this specific league).
  const SIMULATIONS = 2000;
  const madePlayoffs = {};
  Object.values(teamsByRoster).forEach(t => { madePlayoffs[t.owner] = 0; });

  // Remaining games per team, and (across every simulated season) how
  // often a given final win total was good enough to make the playoffs.
  const gamesLeft = {};
  remainingWeeksMatchups.forEach(pairs => pairs.forEach(([ridA, ridB]) => {
    [ridA, ridB].forEach(rid => {
      const t = teamsByRoster[rid];
      if (t) gamesLeft[t.owner] = (gamesLeft[t.owner] || 0) + 1;
    });
  }));
  const seenByWins = {}, madeByWins = {};

  for (let sim = 0; sim < SIMULATIONS; sim++) {
    const simState = {};
    Object.values(teamsByRoster).forEach(t => {
      simState[t.rosterId] = { wins: t.wins, losses: t.losses, ties: t.ties, pointsFor: t.pointsFor };
    });

    remainingWeeksMatchups.forEach(pairs => {
      pairs.forEach(([ridA, ridB]) => {
        const a = teamsByRoster[ridA], b = teamsByRoster[ridB];
        if (!a || !b) return;
        const scoreA = Math.max(0, gaussianRandom(a.projectedMean, a.projectedMean * 0.18));
        const scoreB = Math.max(0, gaussianRandom(b.projectedMean, b.projectedMean * 0.18));
        simState[ridA].pointsFor += scoreA;
        simState[ridB].pointsFor += scoreB;
        if (scoreA > scoreB) { simState[ridA].wins++; simState[ridB].losses++; }
        else if (scoreB > scoreA) { simState[ridB].wins++; simState[ridA].losses++; }
        else { simState[ridA].ties++; simState[ridB].ties++; }
      });
    });

    const finalTeams = Object.keys(simState).map(rid => ({
      owner: teamsByRoster[rid].owner,
      wins: simState[rid].wins, losses: simState[rid].losses, ties: simState[rid].ties,
      pointsFor: simState[rid].pointsFor
    }));
    computePlayoffOrder(finalTeams, playoffSpots).forEach(t => {
      seenByWins[t.wins] = (seenByWins[t.wins] || 0) + 1;
      if (t.status === "In") {
        madePlayoffs[t.owner]++;
        madeByWins[t.wins] = (madeByWins[t.wins] || 0) + 1;
      }
    });
  }

  Object.keys(madePlayoffs).forEach(owner => { odds[owner] = (madePlayoffs[owner] / SIMULATIONS) * 100; });

  // Win totals ranked low to high: the first one that made the
  // playoffs 95%+ of the time is the "lock" number, and the first one
  // that made it at least 1% of the time is the "still alive" floor.
  // Totals seen fewer than 30 times are ignored as too noisy.
  const totals = Object.keys(seenByWins).map(Number).filter(k => seenByWins[k] >= 30).sort((a, b) => a - b);
  const pMake = k => (madeByWins[k] || 0) / seenByWins[k];
  const clinchK = totals.find(k => pMake(k) >= 0.95);
  const aliveK = totals.find(k => pMake(k) >= 0.01);
  const cushion = buildCushion(Object.values(teamsByRoster), gamesLeft, playoffSpots,
    clinchK != null ? clinchK : null, aliveK != null ? aliveK : null);

  return {
    odds, simulated: true, weeksRemaining: remainingWeeksMatchups.length,
    cushion, clinchWins: clinchK != null ? clinchK : null, aliveWins: aliveK != null ? aliveK : null
  };
}

async function renderPlayoffPicture(entry, forceRefresh) {
  const content = document.getElementById("content");
  const season = entry.season;
  state.subCache[season] = state.subCache[season] || {};

  if (forceRefresh) {
    state.cache[season] = null;
    state.subCache[season].playoffOdds = null;
  }

  let teams = state.cache[season];
  if (!teams || !teams.length) {
    try {
      teams = await computeSleeperStandings(entry);
      teams.__source = "sleeper";
      state.cache[season] = teams;
    } catch (e) {
      content.innerHTML = `<div class="placeholder-box"><strong>Couldn't load standings</strong>Check your connection and try again.</div>`;
      return;
    }
  }

  const playoffSpots = getPlayoffSpots(entry);
  const rows = computePlayoffOrder(teams, playoffSpots);

  if (!state.subCache[season].playoffOdds) {
    try {
      state.subCache[season].playoffOdds = await computePlayoffOdds(entry, playoffSpots);
    } catch (e) {
      state.subCache[season].playoffOdds = { odds: {}, simulated: false, weeksRemaining: 0, error: true };
    }
  }
  const oddsInfo = state.subCache[season].playoffOdds;
  const cushionMap = oddsInfo.cushion || {};
  const rowsWithOdds = rows.map(r => {
    const c = cushionMap[r.owner] || {};
    return {
      ...r,
      playoffPct: oddsInfo.odds[r.owner] != null ? oddsInfo.odds[r.owner] : null,
      gamesLeft: c.gamesLeft != null ? c.gamesLeft : null,
      lockNeed: c.cert === "clinched" ? 0 : (c.lockNeed != null ? c.lockNeed : null),
      canLose: c.canLose != null ? c.canLose : null,
      cert: c.cert || null
    };
  });

  const targetNote = (oddsInfo.simulated && oddsInfo.clinchWins != null)
    ? `Rule of thumb from the simulations: about <strong>${oddsInfo.clinchWins} wins</strong> locks up a spot${oddsInfo.aliveWins != null ? `, and about <strong>${oddsInfo.aliveWins} wins</strong> keeps a realistic path alive` : ""}. <strong>Wins to lock</strong> = more wins a team needs to reach the lock number (&ldquo;&mdash;&rdquo; if they can't get there). <strong>Can lose</strong> = remaining games they can drop and still have a path. Clinched/Eliminated are only shown when mathematically certain.`
    : `Clinched/Eliminated are only shown when mathematically certain.`;

  const oddsNote = oddsInfo.simulated
    ? `Playoff % is a Monte Carlo simulation (2,000 runs) of the remaining ${oddsInfo.weeksRemaining} week${oddsInfo.weeksRemaining !== 1 ? "s" : ""}, projecting each team from a blend of their season scoring average and last-3-week form (the same "hot/cold" signal behind Power Rankings), with ~18% week-to-week variance assumed &mdash; a reasonable rule of thumb, not a measured number for this league.`
    : `Playoff % reflects only the current standing &mdash; no remaining schedule was found to simulate (season may be over, or the schedule isn't published yet).`;

  content.innerHTML = `
    <div class="roster-refresh-row">
      <p class="panel-note" style="display:block;">Top ${playoffSpots} make the playoffs &middot; current order by record, then points for.</p>
      <button class="refresh-btn" id="playoffRefreshBtn" title="Re-pull standings and re-run the simulation">&#8635; Refresh</button>
    </div>
    <p class="panel-note" style="margin-bottom:8px;display:block;">${oddsNote}</p>
    <p class="panel-note" style="margin-bottom:14px;display:block;">${targetNote}</p>
    <div class="table-scroll" id="playoffTable"></div>`;

  document.getElementById("playoffRefreshBtn").addEventListener("click", async (e) => {
    e.target.disabled = true;
    e.target.textContent = "Refreshing\u2026";
    await renderPlayoffPicture(entry, true);
  });

  paintSortableTable(
    document.getElementById("playoffTable"),
    [
      { key: "teamName", label: "Team" },
      { key: "owner", label: "Owner" },
      { key: "wins", label: "Record", numeric: true },
      { key: "pointsFor", label: "Pts For", numeric: true },
      { key: "playoffPct", label: "Playoff %", numeric: true },
      { key: "gamesLeft", label: "Left", numeric: true },
      { key: "lockNeed", label: "Wins to lock", numeric: true },
      { key: "canLose", label: "Can lose", numeric: true },
      { key: "status", label: "Status" },
      { key: "back", label: "Back" }
    ],
    rowsWithOdds,
    (r, i) => `
      <tr${r.isCutoff ? ' style="border-bottom: 2px solid var(--amber);"' : ""}>
        <td class="rank">${r.rank}</td>
        <td class="team-name">${escapeHTML(r.teamName)}</td>
        <td class="owner">${escapeHTML(r.owner)}</td>
        <td class="num"><span class="record-w">${r.wins}</span>-<span class="record-l">${r.losses}</span>${r.ties ? "-" + r.ties : ""}</td>
        <td class="num">${r.pointsFor.toFixed(1)}</td>
        <td class="num" style="color: var(--amber); font-family: 'IBM Plex Mono', monospace;">${r.playoffPct != null ? r.playoffPct.toFixed(1) + "%" : "\u2014"}</td>
        <td class="num">${r.gamesLeft != null ? r.gamesLeft : "\u2014"}</td>
        <td class="num ${r.cert === "clinched" ? "record-w" : ""}">${r.cert === "clinched" ? "\u2713 Clinched" : (r.cert === "eliminated" || r.lockNeed == null ? "\u2014" : r.lockNeed)}</td>
        <td class="num ${r.cert === "eliminated" || (r.canLose != null && r.canLose < 0) ? "record-l" : ""}" title="${r.cert === "eliminated" ? "Mathematically eliminated" : (r.canLose != null && r.canLose < 0 ? "Not mathematically out, but under 1% in the simulations even winning out" : "Remaining games this team can lose and still have a path")}">${r.cert === "eliminated" ? "Eliminated" : (r.cert === "clinched" ? "\u2014" : (r.canLose == null ? "\u2014" : (r.canLose < 0 ? "Long shot" : r.canLose)))}</td>
        <td class="num ${r.status === "In" ? "record-w" : "record-l"}">${r.status}</td>
        <td class="num">${r.back}</td>
      </tr>`,
    "playoffPct", "desc"
  );
}

async function renderRosterView(entry) {
  const content = document.getElementById("content");
  const season = entry.season;
  state.subCache[season] = state.subCache[season] || {};

  try {
    if (!state.subCache[season].rosterView) {
      const [users, rosters, valueResult] = await Promise.all([
        getJSON(`${API}/league/${entry.leagueId}/users`),
        getJSON(`${API}/league/${entry.leagueId}/rosters`),
        buildLiveValueMap(entry, false)
      ]);
      if (!state.playersStatic) state.playersStatic = await getJSON(`${API}/players/nfl`);
      const playersDb = state.playersStatic;
      const userMap = {};
      users.forEach(u => { userMap[u.user_id] = u; });

      const teams = rosters.map(r => {
        const u = userMap[r.owner_id] || {};
        const s = r.settings || {};
        const starters = new Set(r.starters || []);
        const reserve = new Set(r.reserve || []);
        const players = (r.players || []).map(pid => {
          const p = playersDb[pid] || {};
          const pos = p.position || "?";
          const name = [p.first_name, p.last_name].filter(Boolean).join(" ") || "Unknown player";
          const skill = ["QB", "RB", "WR", "TE"].includes(pos);
          return {
            name, pos, nfl: p.team || "FA",
            value: skill ? valueFromMap(valueResult.map, name) : null,
            starter: starters.has(pid),
            ir: reserve.has(pid),
            injury: p.injury_status || null
          };
        });
        return {
          owner: canonicalOwner(u.display_name || "Unknown"),
          teamName: (u.metadata && u.metadata.team_name) || u.display_name || "Unknown Team",
          wins: s.wins || 0, losses: s.losses || 0, ties: s.ties || 0,
          pointsFor: (s.fpts || 0) + (s.fpts_decimal || 0) / 100,
          players
        };
      }).sort((a, b) => (b.wins - a.wins) || (b.pointsFor - a.pointsFor));
      state.subCache[season].rosterView = { teams, live: valueResult.live, weekUsed: valueResult.weekUsed };
    }

    const { teams, live, weekUsed } = state.subCache[season].rosterView;
    if (!teams.length) {
      content.innerHTML = `<div class="placeholder-box"><strong>No rosters yet</strong>Rosters for ${season} aren't set.</div>`;
      return;
    }

    const order = ["QB", "RB", "WR", "TE", "K", "DEF"];
    const cards = teams.map(t => {
      const groups = {};
      t.players.forEach(p => { (groups[order.includes(p.pos) ? p.pos : "Other"] = groups[order.includes(p.pos) ? p.pos : "Other"] || []).push(p); });
      const sections = order.concat(["Other"]).filter(g => groups[g]).map(g => {
        const list = groups[g].slice().sort((a, b) => ((b.value || 0) - (a.value || 0)) || a.name.localeCompare(b.name));
        return `<div class="rv-pos">${g === "DEF" ? "Defense" : g === "K" ? "Kicker" : g}</div>` + list.map(p => `
          <div class="rv-player">
            <span class="rv-star">${p.starter ? "\u2605" : ""}</span>
            <span class="rv-name">${escapeHTML(p.name)}${p.ir ? `<span class="rv-tag rv-tag-ir">IR</span>` : ""}${p.injury ? `<span class="rv-tag">${escapeHTML(p.injury.slice(0, 3).toUpperCase())}</span>` : ""}</span>
            <span class="rv-nfl">${escapeHTML(p.nfl)}</span>
            <span class="rv-val">${p.value != null ? p.value.toFixed(0) : ""}</span>
          </div>`).join("");
      }).join("");
      return `
        <details class="rv-card" open>
          <summary>
            <div><div class="rv-team">${escapeHTML(t.teamName)}</div><div class="rv-owner">${escapeHTML(t.owner)}</div></div>
            <div class="rv-record">${t.wins}-${t.losses}${t.ties ? "-" + t.ties : ""}</div>
          </summary>
          <div class="rv-body">${sections}</div>
        </details>`;
    }).join("");

    content.innerHTML = `
      <p class="panel-note" style="margin-bottom:14px;display:block;">Every team's roster by position &middot; &#9733; = in the starting lineup &middot; number = player value (0&ndash;100, ${live ? `based on real production through Week ${weekUsed}` : "preseason rank, no games played yet"}). Click a team to collapse it.</p>
      <div class="rv-grid">${cards}</div>`;
  } catch (e) {
    content.innerHTML = `<div class="placeholder-box"><strong>Couldn't load rosters</strong>Check your connection and try again.</div>`;
  }
}

async function renderWeeklyMatchups(entry) {
  const content = document.getElementById("content");
  const season = entry.season;

  try {
    const [nflState, users, rosters] = await Promise.all([
      getJSON(`${API}/state/nfl`),
      getJSON(`${API}/league/${entry.leagueId}/users`),
      getJSON(`${API}/league/${entry.leagueId}/rosters`)
    ]);
    const week = currentFantasyWeek(nflState);
    const matchups = await getJSON(`${API}/league/${entry.leagueId}/matchups/${week}`);

    if (!matchups || !matchups.length) {
      content.innerHTML = `<div class="placeholder-box"><strong>No matchups yet</strong>Matchups for week ${week} aren't set.</div>`;
      return;
    }

    const userMap = {};
    users.forEach(u => { userMap[u.user_id] = u; });
    const rosterInfo = {};
    rosters.forEach(r => {
      const u = userMap[r.owner_id] || {};
      const s = r.settings || {};
      rosterInfo[r.roster_id] = {
        owner: canonicalOwner(u.display_name || "Unknown"),
        teamName: (u.metadata && u.metadata.team_name) || u.display_name || "Unknown Team",
        wins: s.wins || 0,
        losses: s.losses || 0,
        ties: s.ties || 0,
        pointsFor: ((s.fpts || 0) + (s.fpts_decimal || 0) / 100)
      };
    });

    const playoffSpots = getPlayoffSpots(entry);
    const standingsTeams = Object.values(rosterInfo);

    // Roster Rankings scores are reused if that tab has already been
    // visited this session (cached) -- not fetched fresh here, since
    // it requires the full ~5MB player database and this tab should
    // stay fast by default.
    const rosterScoreByOwner = {};
    if (state.subCache[season] && state.subCache[season].roster) {
      state.subCache[season].roster.forEach(t => { rosterScoreByOwner[t.owner] = t; });
    }

    const byMatchup = {};
    matchups.forEach(m => {
      if (m.matchup_id == null || !rosterInfo[m.roster_id]) return;
      byMatchup[m.matchup_id] = byMatchup[m.matchup_id] || [];
      byMatchup[m.matchup_id].push({ ...rosterInfo[m.roster_id], points: m.points || 0 });
    });

    const pairs = Object.values(byMatchup).filter(p => p.length === 2);

    if (!pairs.length) {
      content.innerHTML = `<div class="placeholder-box"><strong>No head-to-head matchups found</strong>This might be a bye week or a non-standard scoring format.</div>`;
      return;
    }

    const cardsHTML = pairs.map(([a, b], idx) => {
      const aWin = simulateResult(standingsTeams, a.owner, { wins: 1 }, playoffSpots);
      const aLose = simulateResult(standingsTeams, a.owner, { losses: 1 }, playoffSpots);
      const bWin = simulateResult(standingsTeams, b.owner, { wins: 1 }, playoffSpots);
      const bLose = simulateResult(standingsTeams, b.owner, { losses: 1 }, playoffSpots);

      const aRoster = rosterScoreByOwner[a.owner];
      const bRoster = rosterScoreByOwner[b.owner];
      const hasLivePoints = (a.points > 0 || b.points > 0);

      let headline;
      if (hasLivePoints) {
        const leader = a.points >= b.points ? a : b;
        headline = `${escapeHTML(a.teamName)} (${a.points.toFixed(1)}) vs ${escapeHTML(b.teamName)} (${b.points.toFixed(1)}) &mdash; ${escapeHTML(leader.teamName)} currently ahead.`;
      } else if (aRoster && bRoster) {
        const favored = aRoster.rosterScore >= bRoster.rosterScore ? a : b;
        headline = `${escapeHTML(a.teamName)} (${a.wins}-${a.losses}) vs ${escapeHTML(b.teamName)} (${b.wins}-${b.losses}) &mdash; ${escapeHTML(favored.teamName)} grades out as the stronger roster on paper.`;
      } else {
        headline = `${escapeHTML(a.teamName)} (${a.wins}-${a.losses}) vs ${escapeHTML(b.teamName)} (${b.wins}-${b.losses}).`;
      }

      const implicationBlock = (team, win, lose) => `
        <div class="mi-col">
          <div class="mi-team">${escapeHTML(team.teamName)}</div>
          <div class="mi-line"><span class="record-w">Win \u2192</span> ${win.wins}-${win.losses}, #${win.rank} (${win.status})</div>
          <div class="mi-line"><span class="record-l">Loss \u2192</span> ${lose.wins}-${lose.losses}, #${lose.rank} (${lose.status})</div>
        </div>`;

      return `
        <div class="matchup-card" data-idx="${idx}">
          <div class="matchup-teams">
            <div class="matchup-team">
              <div class="mt-name">${escapeHTML(a.teamName)}</div>
              <div class="mt-owner">${escapeHTML(a.owner)}</div>
              <div class="mt-record">${a.wins}-${a.losses}${a.ties ? "-" + a.ties : ""}${hasLivePoints ? ` &middot; ${a.points.toFixed(1)} pts` : ""}</div>
              <button class="pick-btn" data-idx="${idx}" data-side="0">Pick win</button>
            </div>
            <div class="matchup-vs">VS</div>
            <div class="matchup-team">
              <div class="mt-name">${escapeHTML(b.teamName)}</div>
              <div class="mt-owner">${escapeHTML(b.owner)}</div>
              <div class="mt-record">${b.wins}-${b.losses}${b.ties ? "-" + b.ties : ""}${hasLivePoints ? ` &middot; ${b.points.toFixed(1)} pts` : ""}</div>
              <button class="pick-btn" data-idx="${idx}" data-side="1">Pick win</button>
            </div>
          </div>
          <div class="matchup-headline">${headline}</div>
          <div class="matchup-implications">
            ${implicationBlock(a, aWin, aLose)}
            ${implicationBlock(b, bWin, bLose)}
          </div>
        </div>`;
    }).join("");

    const rosterNote = Object.keys(rosterScoreByOwner).length
      ? ""
      : `<p class="panel-note" style="margin-bottom:14px;display:block;">Tip: visit Roster Rankings first to factor roster strength into these headlines.</p>`;

    content.innerHTML = `
      <p class="panel-note" style="margin-bottom:14px;display:block;">Week ${week} matchups &middot; pick a winner in any matchup to see how the standings would shift, or read each team's win/loss scenario below its card.</p>
      ${rosterNote}
      <div class="matchup-layout">
        <div class="matchup-grid">${cardsHTML}</div>
        <aside class="whatif-panel" id="whatIfPanel"></aside>
      </div>
    `;

    // ---- What-if picks: choose a winner per matchup, see projected standings ----
    const picks = {}; // matchup index -> owner picked to win

    function syncCardButtons(idx) {
      const [a, b] = pairs[idx];
      const picked = picks[idx];
      content.querySelectorAll(`.pick-btn[data-idx="${idx}"]`).forEach(btn => {
        const team = pairs[idx][Number(btn.dataset.side)];
        btn.classList.remove("selected", "lost");
        if (!picked) { btn.textContent = "Pick win"; return; }
        if (picked === team.owner) { btn.classList.add("selected"); btn.textContent = "\u2713 Wins"; }
        else { btn.classList.add("lost"); btn.textContent = "Loses"; }
      });
    }

    function renderWhatIf() {
      const panel = document.getElementById("whatIfPanel");
      const projected = standingsTeams.map(t => ({ ...t }));
      let pickCount = 0;
      pairs.forEach(([a, b], idx) => {
        const winner = picks[idx];
        if (!winner) return;
        pickCount++;
        const loser = winner === a.owner ? b.owner : a.owner;
        projected.find(t => t.owner === winner).wins++;
        projected.find(t => t.owner === loser).losses++;
      });

      const before = {};
      computePlayoffOrder(standingsTeams, playoffSpots).forEach(t => { before[t.owner] = t; });
      const after = computePlayoffOrder(projected, playoffSpots);

      const rows = after.map(t => {
        const was = before[t.owner];
        const delta = was.rank - t.rank;
        let moveHTML = `<span class="wi-flat">\u2014</span>`;
        if (delta > 0) moveHTML = `<span class="record-w">\u25B2${delta}</span>`;
        else if (delta < 0) moveHTML = `<span class="record-l">\u25BC${Math.abs(delta)}</span>`;
        let statusHTML = `<span class="${t.status === "In" ? "record-w" : "record-l"}">${t.status}</span>`;
        if (t.status !== was.status) {
          statusHTML += t.status === "In" ? ` <span class="wi-tag wi-tag-in">new</span>` : ` <span class="wi-tag wi-tag-out">out</span>`;
        }
        return `
          <tr${t.isCutoff ? ' style="border-bottom: 2px solid var(--amber);"' : ""}>
            <td class="wi-rank">${t.rank}</td>
            <td class="wi-move">${moveHTML}</td>
            <td class="wi-team" title="${escapeHTML(t.owner)}">${escapeHTML(t.teamName)}</td>
            <td class="wi-rec">${t.wins}-${t.losses}${t.ties ? "-" + t.ties : ""}</td>
            <td class="wi-status">${statusHTML}</td>
          </tr>`;
      }).join("");

      panel.innerHTML = `
        <div class="wi-head">
          <h3 class="wi-title">Projected standings</h3>
          <button class="refresh-btn" id="whatIfReset"${pickCount ? "" : " disabled"}>Reset</button>
        </div>
        <p class="wi-sub">${pickCount} of ${pairs.length} matchup${pairs.length !== 1 ? "s" : ""} picked &middot; top ${playoffSpots} make the playoffs. Ties in record fall back to points scored so far.</p>
        <table class="wi-table"><tbody>${rows}</tbody></table>
      `;
      document.getElementById("whatIfReset").addEventListener("click", () => {
        Object.keys(picks).forEach(k => delete picks[k]);
        pairs.forEach((_, i) => syncCardButtons(i));
        renderWhatIf();
      });
    }

    content.querySelectorAll(".pick-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.idx);
        const owner = pairs[idx][Number(btn.dataset.side)].owner;
        if (picks[idx] === owner) delete picks[idx];
        else picks[idx] = owner;
        syncCardButtons(idx);
        renderWhatIf();
      });
    });

    renderWhatIf();
  } catch (e) {
    content.innerHTML = `<div class="placeholder-box"><strong>Couldn't load this week's matchups</strong>Check your connection and try again.</div>`;
  }
}

/* =========================================================
   NAVIGATION / CONTROL FLOW
   ========================================================= */
async function selectSeason(season) {
  state.activeSeason = season;
  state.activeSubView = "standings";
  renderSeasonNav();

  const entry = state.seasons.find(s => s.season === season);
  renderSeasonSubNav(entry);

  if (state.cache[season]) {
    renderStandings(season, state.cache[season], state.cache[season].__source);
    if (season === state.seasons[state.seasons.length - 1].season) renderScoreboard(season, state.cache[season]);
    return;
  }

  document.getElementById("content").innerHTML = `<div class="loading-row">Loading ${season}&hellip;</div>`;

  let teams = null;
  if (entry.source === "sleeper") {
    teams = await computeSleeperStandings(entry);
  } else if (entry.source === "historical") {
    teams = getHistoricalStandings(season);
  }

  if (teams) teams.__source = entry.source;
  state.cache[season] = teams || [];
  state.cache[season].__source = entry.source;

  renderStandings(season, teams, entry.source);
}

function renderSeasonSubNav(entry) {
  const nav = document.getElementById("seasonSubNav");
  if (!entry || entry.source !== "sleeper") {
    nav.innerHTML = "";
    return;
  }
  const tabs = [
    { key: "standings", label: "Standings" },
    { key: "matchups", label: "This Week" },
    { key: "rosters", label: "Rosters" },
    { key: "roster", label: "Roster Rankings" },
    { key: "power", label: "Power Rankings" },
    { key: "playoff", label: "Playoff Picture" }
  ];
  nav.innerHTML = tabs.map(t =>
    `<button class="sub-tab-btn${t.key === state.activeSubView ? " active" : ""}" data-sub="${t.key}">${t.label}</button>`
  ).join("");
  nav.querySelectorAll(".sub-tab-btn").forEach(btn => {
    btn.addEventListener("click", () => selectSubView(entry, btn.dataset.sub));
  });
}

async function selectSubView(entry, view) {
  state.activeSubView = view;
  renderSeasonSubNav(entry);

  const content = document.getElementById("content");
  const season = entry.season;

  if (view === "standings") {
    const teams = state.cache[season];
    renderStandings(season, teams, entry.source);
    return;
  }
  if (view === "matchups") {
    content.innerHTML = `<div class="loading-row">Pulling this week's matchups&hellip;</div>`;
    await renderWeeklyMatchups(entry);
    return;
  }
  if (view === "rosters") {
    content.innerHTML = `<div class="loading-row">Loading rosters&hellip;</div>`;
    await renderRosterView(entry);
    return;
  }
  if (view === "roster") {
    content.innerHTML = `<div class="loading-row">Scoring rosters against 2026 rankings&hellip;</div>`;
    await renderRosterRankings(entry);
    return;
  }
  if (view === "power") {
    content.innerHTML = `<div class="loading-row">Crunching weekly scores&hellip;</div>`;
    await renderInSeasonPowerRankings(entry);
    return;
  }
  if (view === "playoff") {
    content.innerHTML = `<div class="loading-row">Simulating the rest of the season&hellip;</div>`;
    await renderPlayoffPicture(entry);
    return;
  }
}
