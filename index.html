<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --field: #17151E;
    --field-2: #221E2C;
    --field-3: #3D2E5C;
    --chalk: #EFEAF7;
    --chalk-dim: #9A91B0;
    --amber: #CBA135;
    --amber-dim: #8F7326;
    --turf-line: rgba(239,234,247,0.12);
    --loss-red: #C1667A;
    --win-green: #7CB88F;
    --ink: #16121C;
    --radius: 6px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--field);
    background-image:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 64px);
    color: var(--chalk);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  /* ---------- HERO ---------- */
  header.hero {
    padding: 56px 0 36px;
    border-bottom: 1px solid var(--turf-line);
    position: relative;
    overflow: hidden;
  }
  header.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% -10%, rgba(203,161,53,0.14), transparent 50%),
      radial-gradient(ellipse at 85% 10%, rgba(124,90,196,0.16), transparent 55%);
    pointer-events: none;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 10px;
  }
  h1.league-name {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: clamp(38px, 6vw, 64px);
    line-height: 0.95;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    text-transform: uppercase;
  }
  .league-sub {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--chalk-dim);
    font-size: 13px;
  }

  .scoreboard-strip {
    margin-top: 32px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--turf-line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--field-2);
  }
  .sb-cell {
    padding: 16px 18px;
    border-right: 1px solid var(--turf-line);
  }
  .sb-cell:last-child { border-right: none; }
  .sb-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 6px;
  }
  .sb-value {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: 22px;
    color: var(--amber);
    text-transform: uppercase;
    line-height: 1.1;
  }
  .sb-value small { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--chalk-dim); }

  /* ---------- YARD-LINE SEASON NAV ---------- */
  nav.yardline {
    margin: 34px 0 0;
    position: relative;
    padding-top: 6px;
  }
  .yardline-track {
    display: flex;
    align-items: flex-end;
    gap: 0;
    border-bottom: 2px solid var(--turf-line);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .yard-tick {
    flex: 1 0 auto;
    min-width: 64px;
    text-align: center;
    padding: 0 4px 12px;
    cursor: pointer;
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    position: relative;
    transition: color 0.15s ease;
  }
  .yard-tick::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 8px;
    background: var(--turf-line);
  }
  .yard-tick.active { color: var(--amber); font-weight: 700; }
  .yard-tick.active::after { background: var(--amber); height: 14px; width: 3px; bottom: -2px; }
  .yard-tick:hover:not(.active) { color: var(--chalk); }
  .yard-tick .dot {
    display: none;
  }
  .yard-tick.no-data { opacity: 0.45; }

  /* ---------- CONTENT ---------- */
  main { padding: 36px 0 80px; }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h2.panel-title {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    text-transform: uppercase;
    font-size: 24px;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--chalk);
  }
  .panel-note { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--chalk-dim); }

  table.standings {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  table.standings thead th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    padding: 0 14px 10px;
    border-bottom: 1px solid var(--turf-line);
    font-weight: 400;
  }
  table.standings thead th.num, table.standings td.num { text-align: right; }
  th.sortable {
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th.sortable:hover { color: var(--chalk); }
  th.sortable.active-sort { color: var(--amber); }
  .sort-arrow { font-size: 8px; margin-left: 3px; display: inline-block; }
  table.standings tbody tr {
    border-bottom: 1px solid rgba(243,239,226,0.06);
  }
  table.standings tbody tr:nth-child(odd) { background: rgba(255,255,255,0.015); }
  table.standings tbody tr:hover { background: rgba(203,161,53,0.08); }
  table.standings td {
    padding: 12px 14px;
    vertical-align: middle;
  }
  td.rank {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    color: var(--amber-dim);
    font-size: 16px;
    width: 34px;
  }
  tr:first-child td.rank { color: var(--amber); }
  td.team-name { font-weight: 600; }
  td.owner { color: var(--chalk-dim); font-size: 12.5px; }
  td.num { font-family: 'IBM Plex Mono', monospace; }
  .record-w { color: var(--win-green); }
  .record-l { color: var(--loss-red); }
  .streak-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid var(--turf-line);
  }

  .placeholder-box {
    border: 1px dashed var(--turf-line);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    color: var(--chalk-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
  }
  .placeholder-box strong { color: var(--amber); display: block; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 18px; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.02em;}

  .loading-row { color: var(--chalk-dim); font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 24px 0; }

  footer {
    border-top: 1px solid var(--turf-line);
    padding: 20px 0 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--chalk-dim);
    text-align: center;
  }

  /* ---------- VIEW TOGGLE ---------- */
  .view-toggle {
    display: inline-flex;
    margin-top: 30px;
    border: 1px solid var(--turf-line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .toggle-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: transparent;
    color: var(--chalk-dim);
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    border-right: 1px solid var(--turf-line);
  }
  .toggle-btn:last-child { border-right: none; }
  .toggle-btn.active { background: var(--amber); color: var(--ink); font-weight: 700; }
  .toggle-btn:hover:not(.active) { color: var(--chalk); }

  /* ---------- SEASON SUB-TABS ---------- */
  .sub-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 4px 0 20px;
  }
  .sub-tab-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--field-2);
    color: var(--chalk-dim);
    border: 1px solid var(--turf-line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .sub-tab-btn:hover:not(.active) { color: var(--chalk); border-color: rgba(124,90,196,0.5); }
  .sub-tab-btn.active { color: var(--ink); background: var(--amber); border-color: var(--amber); font-weight: 700; }

  /* ---------- HISTORICAL STATS ---------- */
  #historyView { padding: 36px 0 80px; }
  .hist-section { margin-bottom: 44px; }
  .hist-section-head {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    text-transform: uppercase;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: var(--chalk);
    margin: 0 0 4px;
  }
  .hist-section-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--chalk-dim);
    margin: 0 0 14px;
  }

  .record-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 44px;
  }
  .record-card {
    border: 1px solid var(--turf-line);
    border-radius: var(--radius);
    background: var(--field-2);
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }
  .record-card:hover { border-color: rgba(203,161,53,0.4); }
  .record-card-highlight {
    border-color: var(--amber);
    background: linear-gradient(160deg, var(--field-2), var(--field-3) 220%);
  }
  .record-card-highlight .rc-name { font-size: 26px; }
  .record-card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--amber), var(--field-3) 130%);
  }
  .record-card .rc-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 8px;
  }
  .record-card .rc-name {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: 22px;
    text-transform: uppercase;
    color: var(--amber);
    line-height: 1.15;
  }
  .record-card .rc-detail {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--chalk-dim);
    margin-top: 4px;
  }

  table.hist-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.hist-table thead th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--turf-line);
    font-weight: 400;
  }
  table.hist-table thead th.num, table.hist-table td.num { text-align: right; }
  table.hist-table tbody tr { border-bottom: 1px solid rgba(243,239,226,0.06); }
  table.hist-table tbody tr:nth-child(odd) { background: rgba(255,255,255,0.015); }
  table.hist-table tbody tr:hover { background: rgba(203,161,53,0.08); }
  table.hist-table td { padding: 10px 12px; vertical-align: middle; }
  table.hist-table td.num { font-family: 'IBM Plex Mono', monospace; }
  table.hist-table td.rank {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    color: var(--amber-dim);
    font-size: 15px;
    width: 30px;
  }
  table.hist-table tr:first-child td.rank { color: var(--amber); }
  .trophy-count {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--amber);
  }
  .years-list { color: var(--chalk-dim); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  .table-scroll { width: 100%; overflow-x: auto; }

  @media (max-width: 640px) {

    .scoreboard-strip { grid-template-columns: repeat(2, 1fr); }
    table.standings { font-size: 12.5px; }
    td.owner { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Fantasy Football &mdash; League HQ</p>
    <h1 class="league-name" id="leagueName">Loading League&hellip;</h1>
    <p class="league-sub" id="leagueSub">Pulling live data from Sleeper</p>

    <div class="scoreboard-strip" id="scoreboardStrip">
      <div class="sb-cell"><div class="sb-label">Season</div><div class="sb-value" id="sbSeason">&mdash;</div></div>
      <div class="sb-cell"><div class="sb-label">Leader</div><div class="sb-value" id="sbLeader">&mdash;</div></div>
      <div class="sb-cell"><div class="sb-label">Top Scorer</div><div class="sb-value" id="sbTopScorer">&mdash;</div></div>
      <div class="sb-cell"><div class="sb-label">Teams</div><div class="sb-value" id="sbTeams">&mdash;</div></div>
    </div>
  </header>

  <div class="view-toggle" id="viewToggle">
    <button class="toggle-btn active" data-view="season">Season Standings</button>
    <button class="toggle-btn" data-view="history">Historical Stats</button>
  </div>

  <div id="seasonView">
    <nav class="yardline">
      <div class="yardline-track" id="seasonTrack"></div>
    </nav>

    <main>
      <div class="panel-head">
        <h2 class="panel-title" id="panelTitle">Standings</h2>
        <span class="panel-note" id="panelNote"></span>
      </div>
      <div class="sub-tabs" id="seasonSubNav"></div>
      <div id="content"><div class="loading-row">Fetching standings&hellip;</div></div>
    </main>
  </div>

  <div id="historyView" style="display:none;">
    <div id="historyContent"><div class="loading-row">Crunching every season&hellip;</div></div>
  </div>

  <footer>
    Data via the Sleeper API &middot; auto-refreshes on page load &middot; built for the league
  </footer>
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  currentLeagueId: "1389327730440413184",
  // Pre-Sleeper seasons (2018-2021). Fill these in once historical
  // spreadsheets are parsed — see HISTORICAL_DATA below.
  earliestTrackedSeason: 2018
};

/* =========================================================
   HISTORICAL DATA (pre-2022, sourced from league spreadsheets)
   Structure expected once populated:
   {
     2021: { teams: [ { owner, teamName, wins, losses, ties, pointsFor, pointsAgainst, finish } , ... ] },
     2020: { ... }, 2019: { ... }, 2018: { ... }
   }
   Left empty until spreadsheets are supplied — the UI shows a
   placeholder for any season with no entry here and no Sleeper data.
   ========================================================= */
const HISTORICAL_DATA = {
  // Champion-only years — regular-season records/points weren't kept
  // in a form we could recover for these two seasons.
  2018: { champion: "Morgan" },
  2019: { champion: "Adam" },

  // Full regular-season rank + points for/against, pulled from the
  // league spreadsheet. Wins/losses per individual season weren't
  // tracked separately from the all-time cumulative total, so no
  // per-season record is shown for these two years.
  2020: {
    champion: "Daniel",
    teams: [
      { owner: "Daniel", rank: 1,  pointsFor: 1705.1, pointsAgainst: 1439.5 },
      { owner: "Joey",   rank: 2,  pointsFor: 1568.2, pointsAgainst: 1590.4 },
      { owner: "Morgan", rank: 3,  pointsFor: 1513.8, pointsAgainst: 1530.4 },
      { owner: "Kurt",   rank: 4,  pointsFor: 1381.9, pointsAgainst: 1541.3 },
      { owner: "Austin", rank: 5,  pointsFor: 1663.4, pointsAgainst: 1492.2 },
      { owner: "JR",     rank: 6,  pointsFor: 1497.0, pointsAgainst: 1584.7 },
      { owner: "Logan",  rank: 7,  pointsFor: 1517.1, pointsAgainst: 1576.9 },
      { owner: "Tyler",  rank: 8,  pointsFor: 1465.6, pointsAgainst: 1464.0 },
      { owner: "Adam",   rank: 9,  pointsFor: 1753.4, pointsAgainst: 1718.6 },
      { owner: "Tim",    rank: 10, pointsFor: 1589.9, pointsAgainst: 1548.2 },
      { owner: "Dylan",  rank: 11, pointsFor: 1392.9, pointsAgainst: 1538.1 },
      { owner: "Justin", rank: 12, pointsFor: 1479.6, pointsAgainst: 1503.6 }
    ]
  },
  2021: {
    champion: "Morgan",
    teams: [
      { owner: "Joey",   rank: 1,  pointsFor: 1488.6, pointsAgainst: 1635.4 },
      { owner: "Tyler",  rank: 2,  pointsFor: 1369.2, pointsAgainst: 1690.5 },
      { owner: "Morgan", rank: 3,  pointsFor: 1854.2, pointsAgainst: 1629.5 },
      { owner: "Kurt",   rank: 4,  pointsFor: 1587.4, pointsAgainst: 1618.5 },
      { owner: "Adam",   rank: 5,  pointsFor: 1937.3, pointsAgainst: 1637.5 },
      { owner: "Austin", rank: 6,  pointsFor: 1613.9, pointsAgainst: 1574.4 },
      { owner: "Justin", rank: 7,  pointsFor: 1706.6, pointsAgainst: 1530.7 },
      { owner: "Tim",    rank: 8,  pointsFor: 1649.8, pointsAgainst: 1752.1 },
      { owner: "Daniel", rank: 9,  pointsFor: 1641.0, pointsAgainst: 1728.9 },
      { owner: "JR",     rank: 10, pointsFor: 1703.2, pointsAgainst: 1660.0 },
      { owner: "Dylan",  rank: 11, pointsFor: 1497.9, pointsAgainst: 1625.1 },
      { owner: "Logan",  rank: 12, pointsFor: 1547.9, pointsAgainst: 1514.4 }
    ]
  }
};

// Champions by year, where known, shown as a badge on that season's
// panel regardless of whether full standings are available.
const CHAMPIONS = {
  2018: "Morgan", 2019: "Adam", 2020: "Daniel", 2021: "Morgan",
  2022: "Tim", 2023: "Logan", 2024: "Daniel", 2025: "Tim"
};

// Cumulative career record for 2020-2025, straight from the league
// spreadsheet's win/loss table. These six seasons overlap with what
// Sleeper can also compute (2022-2025), so this is used as the
// source of truth for that whole span instead of re-deriving it
// from Sleeper — only seasons after 2025 get added from Sleeper on
// top of this.
const CAREER_RECORD_2020_2025 = {
  Joey:   { wins: 48, losses: 35, ties: 0 },
  Morgan: { wins: 48, losses: 35, ties: 0 },
  Daniel: { wins: 45, losses: 38, ties: 0 },
  JR:     { wins: 44, losses: 40, ties: 0 },
  Austin: { wins: 43, losses: 40, ties: 0 },
  Adam:   { wins: 43, losses: 40, ties: 0 },
  Tim:    { wins: 42, losses: 41, ties: 0 },
  Logan:  { wins: 41, losses: 42, ties: 0 },
  Tyler:  { wins: 37, losses: 46, ties: 0 },
  Kurt:   { wins: 37, losses: 46, ties: 0 },
  Justin: { wins: 37, losses: 46, ties: 0 },
  Dylan:  { wins: 34, losses: 50, ties: 0 }
};

const API = "https://api.sleeper.app/v1";
const state = {
  seasons: [],        // [{season, leagueId, source: 'sleeper'|'historical'}]
  activeSeason: null,
  activeSubView: "standings",
  cache: {},           // season -> computed standings
  subCache: {}          // season -> { draft: [...], power: [...], playoff: {...} }
};

/* =========================================================
   DATA FETCHING
   ========================================================= */
async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("Request failed: " + url);
  return res.json();
}

async function buildSeasonChain() {
  const chain = [];
  let leagueId = CONFIG.currentLeagueId;
  let guard = 0;
  while (leagueId && leagueId !== "0" && guard < 25) {
    guard++;
    let league;
    try {
      league = await getJSON(`${API}/league/${leagueId}`);
    } catch (e) {
      break;
    }
    chain.push({ season: parseInt(league.season, 10), leagueId, source: "sleeper", leagueMeta: league });
    leagueId = league.previous_league_id;
  }
  chain.sort((a, b) => a.season - b.season);

  // Fill in any pre-Sleeper seasons from historical data / placeholders
  const earliestSleeperSeason = chain.length ? chain[0].season : new Date().getFullYear();
  for (let yr = CONFIG.earliestTrackedSeason; yr < earliestSleeperSeason; yr++) {
    if (HISTORICAL_DATA[yr]) {
      chain.unshift({ season: yr, source: "historical" });
    } else {
      chain.unshift({ season: yr, source: "missing" });
    }
  }
  chain.sort((a, b) => a.season - b.season);
  return chain;
}

// Maps Sleeper display names/usernames to the real names used in
// league history (spreadsheet + champions), so career stats combine
// correctly across both data sources instead of treating someone's
// Sleeper handle as a separate person.
const OWNER_ALIASES = {
  "gstv": "Joey",
  "Pacfan8725": "Morgan",
  "Packfan6725": "Morgan",
  "djarboe": "Daniel",
  "Jlanham0029": "JR",
  "AyeTeeWhy": "Adam",
  "austinmc20": "Austin",
  "timothydawson": "Tim",
  "wetdirt99": "Tyler",
  "lmatt10": "Logan",
  "FantasyCK": "Kurt",
  "Justind82": "Justin",
  "TopGunHatch": "Dylan"
};
function canonicalOwner(name) {
  return OWNER_ALIASES[name] || name;
}

async function computeSleeperStandings(entry) {
  const { leagueId } = entry;
  const [users, rosters] = await Promise.all([
    getJSON(`${API}/league/${leagueId}/users`),
    getJSON(`${API}/league/${leagueId}/rosters`)
  ]);
  const userMap = {};
  users.forEach(u => { userMap[u.user_id] = u; });

  const teams = rosters.map(r => {
    const u = userMap[r.owner_id] || {};
    const teamName = (u.metadata && u.metadata.team_name) || u.display_name || "Unknown Team";
    const s = r.settings || {};
    return {
      owner: canonicalOwner(u.display_name || "Unknown"),
      teamName,
      wins: s.wins || 0,
      losses: s.losses || 0,
      ties: s.ties || 0,
      pointsFor: ((s.fpts || 0) + (s.fpts_decimal || 0) / 100),
      pointsAgainst: ((s.fpts_against || 0) + (s.fpts_against_decimal || 0) / 100),
      streak: s.streak || null
    };
  });

  teams.sort((a, b) => {
    if (b.wins !== a.wins) return b.wins - a.wins;
    return b.pointsFor - a.pointsFor;
  });

  return teams;
}

function getHistoricalStandings(season) {
  const data = HISTORICAL_DATA[season];
  if (!data || !data.teams) return null;
  const teams = data.teams.slice().sort((a, b) => {
    if (a.rank != null && b.rank != null) return a.rank - b.rank;
    if (b.wins !== a.wins) return (b.wins || 0) - (a.wins || 0);
    return (b.pointsFor || 0) - (a.pointsFor || 0);
  });
  return teams;
}

/* =========================================================
   GENERIC SORTABLE TABLE
   columns: [{ key, label, numeric, render(row, i) => cell HTML }]
   ========================================================= */
function paintSortableTable(container, columns, rows, cellHTML, defaultKey, defaultDir) {
  let sortKey = defaultKey;
  let dir = defaultDir || "desc";

  function getSorted() {
    return rows.slice().sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (typeof va === "string" || typeof vb === "string") {
        va = (va == null ? "" : String(va)).toLowerCase();
        vb = (vb == null ? "" : String(vb)).toLowerCase();
        if (va < vb) return dir === "asc" ? -1 : 1;
        if (va > vb) return dir === "asc" ? 1 : -1;
        return 0;
      }
      va = va == null ? -Infinity : va;
      vb = vb == null ? -Infinity : vb;
      return dir === "asc" ? va - vb : vb - va;
    });
  }

  function paint() {
    const theadHTML = `<tr>
      <th></th>
      ${columns.map(c => `
        <th class="${c.numeric ? "num " : ""}sortable${c.key === sortKey ? " active-sort" : ""}" data-key="${c.key}">
          ${c.label}${c.key === sortKey ? `<span class="sort-arrow">${dir === "asc" ? "\u25B2" : "\u25BC"}</span>` : ""}
        </th>`).join("")}
    </tr>`;
    const sortedRows = getSorted();
    const tbodyHTML = sortedRows.map((row, i) => cellHTML(row, i)).join("") ||
      `<tr><td colspan="${columns.length + 1}">No data yet.</td></tr>`;

    container.innerHTML = `<table class="hist-table sortable-table"><thead>${theadHTML}</thead><tbody>${tbodyHTML}</tbody></table>`;
    container.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (key === sortKey) {
          dir = dir === "asc" ? "desc" : "asc";
        } else {
          sortKey = key;
          dir = columns.find(c => c.key === key).numeric ? "desc" : "asc";
        }
        paint();
      });
    });
  }
  paint();
}

    { key: "diff", label: "Diff", numeric: true }
  ];

  paintSortableTable(
    document.getElementById("content"),
    columns,
    rows,
    (t, i) => {

      const diffStr = (t.diff >= 0 ? "+" : "") + t.diff.toFixed(1);

      <tr>
        <td class="rank">${i + 1}</td>

        <td class="num">${t.pointsFor.toFixed(1)}</td>
        <td class="num">${t.pointsAgainst.toFixed(1)}</td>
        <td class="num ${diffClass}">${diffStr}</td>
      </tr>`;
    },
    hasRecord ? "wins" : "pointsFor",
    "desc"
  );
}

function renderScoreboard(season, teams) {

function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);

}

/* =========================================================
   IN-SEASON POWER RANKINGS
   ========================================================= */
async function renderInSeasonPowerRankings(entry) {
  const content = document.getElementById("content");
  const season = entry.season;
  state.subCache[season] = state.subCache[season] || {};

  if (!state.subCache[season].power) {
    try {
      const [users, rosters, nflState] = await Promise.all([
        getJSON(`${API}/league/${entry.leagueId}/users`),
        getJSON(`${API}/league/${entry.leagueId}/rosters`),
        getJSON(`${API}/state/nfl`)
      ]);
      const userMap = {};
      users.forEach(u => { userMap[u.user_id] = u; });
      const rosterOwner = {};
      const rosterTeamName = {};
      rosters.forEach(r => {
        const u = userMap[r.owner_id] || {};
        rosterOwner[r.roster_id] = canonicalOwner(u.display_name || "Unknown");
        rosterTeamName[r.roster_id] = (u.metadata && u.metadata.team_name) || u.display_name || "Unknown Team";
      });

      const currentWeek = (nflState && nflState.week) || 1;
      const perRoster = {};
      Object.keys(rosterOwner).forEach(rid => {
        perRoster[rid] = { rosterId: rid, owner: rosterOwner[rid], teamName: rosterTeamName[rid], weekly: [], wins: 0, losses: 0, ties: 0 };
      });

      let weeksPlayed = 0;
      for (let wk = 1; wk <= currentWeek; wk++) {
        let matchups;
        try {
          matchups = await getJSON(`${API}/league/${entry.leagueId}/matchups/${wk}`);
        } catch (e) {
          continue;
        }
        if (!matchups || !matchups.length) continue;
        const anyPoints = matchups.some(m => (m.points || 0) > 0);
        if (!anyPoints) continue;
        weeksPlayed++;

        const byMatchup = {};
        matchups.forEach(m => {
          if (m.matchup_id == null) return;
          byMatchup[m.matchup_id] = byMatchup[m.matchup_id] || [];
          byMatchup[m.matchup_id].push(m);
        });

        matchups.forEach(m => {
          if (!perRoster[m.roster_id]) return;
          perRoster[m.roster_id].weekly.push(m.points || 0);
        });

        Object.values(byMatchup).forEach(pair => {
          if (pair.length !== 2) return;
          const [a, b] = pair;
          if (!perRoster[a.roster_id] || !perRoster[b.roster_id]) return;
          if ((a.points || 0) > (b.points || 0)) {
            perRoster[a.roster_id].wins++;
            perRoster[b.roster_id].losses++;
          } else if ((a.points || 0) < (b.points || 0)) {
            perRoster[b.roster_id].wins++;
            perRoster[a.roster_id].losses++;
          } else {
            perRoster[a.roster_id].ties++;
            perRoster[b.roster_id].ties++;
          }
        });
      }

      state.subCache[season].power = { weeksPlayed, rosters: Object.values(perRoster) };
    } catch (e) {
      state.subCache[season].power = null;
    }
  }

  const data = state.subCache[season].power;

  if (data === null) {
    content.innerHTML = `<div class="placeholder-box"><strong>Couldn't load weekly scores</strong>Check your connection and try again.</div>`;
    return;
  }
  if (!data.weeksPlayed) {
    content.innerHTML = `<div class="placeholder-box"><strong>Season hasn't kicked off yet</strong>Power rankings for ${season} will populate once games start counting.</div>`;
    return;
  }

  const rows = data.rosters
    .filter(r => r.weekly.length)
    .map(r => {
      const games = r.weekly.length;
      const total = r.weekly.reduce((s, p) => s + p, 0);
      const avg = total / games;
      const last3 = r.weekly.slice(-3);
      const recentForm = last3.reduce((s, p) => s + p, 0) / last3.length;
      const gp = r.wins + r.losses + r.ties;
      const winPct = gp ? (r.wins + r.ties * 0.5) / gp : 0;
      return { owner: r.owner, teamName: r.teamName, wins: r.wins, losses: r.losses, ties: r.ties, winPct, avg, recentForm, total };
    });

  const range = arr => ({ min: Math.min(...arr), max: Math.max(...arr) });
  const normalize = (v, min, max) => max === min ? 100 : (v - min) / (max - min) * 100;
  const wpR = range(rows.map(r => r.winPct));
  const avgR = range(rows.map(r => r.avg));
  const formR = range(rows.map(r => r.recentForm));
  const diffR = range(rows.map(r => r.avg)); // proxy: uses scoring range again for stability when no PA tracked weekly here

  const ranked = rows.map(r => {
    const score =
      normalize(r.winPct, wpR.min, wpR.max) * 0.30 +
      normalize(r.avg, avgR.min, avgR.max) * 0.25 +
      normalize(r.recentForm, formR.min, formR.max) * 0.25 +
      normalize(r.avg, diffR.min, diffR.max) * 0.20;
    return { ...r, score };
  }).sort((a, b) => b.score - a.score);

  content.innerHTML = `<p class="panel-note" style="margin-bottom:14px;display:block;">Through ${data.weeksPlayed} week${data.weeksPlayed !== 1 ? "s" : ""} &middot; blends win % (30%), scoring average (25%), last-3-week form (25%), and week-to-week diff (20%)</p><div class="table-scroll" id="inSeasonPowerTable"></div>`;

  paintSortableTable(
    document.getElementById("inSeasonPowerTable"),
    [
      { key: "teamName", label: "Team" },
      { key: "owner", label: "Owner" },
      { key: "score", label: "Power Score", numeric: true },
      { key: "wins", label: "Record", numeric: true },
      { key: "avg", label: "Avg Pts", numeric: true },
      { key: "recentForm", label: "Last 3 Avg", numeric: true }
    ],
    ranked,
    (r, i) => `
      <tr>
        <td class="rank">${i + 1}</td>
        <td class="team-name">${escapeHTML(r.teamName)}</td>
        <td class="owner">${escapeHTML(r.owner)}</td>
        <td class="num" style="color: var(--amber); font-family: 'IBM Plex Mono', monospace;">${r.score.toFixed(1)}</td>
        <td class="num"><span class="record-w">${r.wins}</span>-<span class="record-l">${r.losses}</span>${r.ties ? "-" + r.ties : ""}</td>
        <td class="num">${r.avg.toFixed(1)}</td>
        <td class="num">${r.recentForm.toFixed(1)}</td>
      </tr>`,
    "score", "desc"
  );
}

/* =========================================================
   PLAYOFF PICTURE
   ========================================================= */
async function renderPlayoffPicture(entry) {
  const content = document.getElementById("content");
  const season = entry.season;

  let teams = state.cache[season];
  if (!teams || !teams.length) {
    try {
      teams = await computeSleeperStandings(entry);
      teams.__source = "sleeper";
      state.cache[season] = teams;
    } catch (e) {
      content.innerHTML = `<div class="placeholder-box"><strong>Couldn't load standings</strong>Check your connection and try again.</div>`;
      return;
    }
  }

  const league = entry.leagueMeta || {};
  const playoffSpots = (league.settings && league.settings.playoff_teams) || 6;
  const sorted = teams.slice().sort((a, b) => (b.wins - a.wins) || (b.pointsFor - a.pointsFor));
  const cutoffTeam = sorted[playoffSpots - 1];

  const rows = sorted.map((t, i) => {
    const inPlayoffs = i < playoffSpots;
    let back = "\u2014";
    if (!inPlayoffs && cutoffTeam) {
      const winsBack = cutoffTeam.wins - t.wins;
      back = winsBack > 0 ? `${winsBack.toFixed(1)} game${winsBack !== 1 ? "s" : ""}` : `${(cutoffTeam.pointsFor - t.pointsFor).toFixed(1)} pts`;
    }
    return { ...t, rank: i + 1, status: inPlayoffs ? "In" : "Out", back, isCutoff: i === playoffSpots - 1 };
  });

  content.innerHTML = `<p class="panel-note" style="margin-bottom:14px;display:block;">Top ${playoffSpots} make the playoffs &middot; current order by record, then points for</p><div class="table-scroll" id="playoffTable"></div>`;

  paintSortableTable(
    document.getElementById("playoffTable"),
    [
      { key: "teamName", label: "Team" },
      { key: "owner", label: "Owner" },
      { key: "wins", label: "Record", numeric: true },
      { key: "pointsFor", label: "Pts For", numeric: true },
      { key: "status", label: "Status" },
      { key: "back", label: "Back" }
    ],
    rows,
    (r, i) => `
      <tr${r.isCutoff ? ' style="border-bottom: 2px solid var(--amber);"' : ""}>
        <td class="rank">${r.rank}</td>
        <td class="team-name">${escapeHTML(r.teamName)}</td>
        <td class="owner">${escapeHTML(r.owner)}</td>
        <td class="num"><span class="record-w">${r.wins}</span>-<span class="record-l">${r.losses}</span>${r.ties ? "-" + r.ties : ""}</td>
        <td class="num">${r.pointsFor.toFixed(1)}</td>
        <td class="num ${r.status === "In" ? "record-w" : "record-l"}">${r.status}</td>
        <td class="num">${r.back}</td>
      </tr>`,
    "wins", "desc"
  );
}

/* =========================================================
   NAVIGATION / CONTROL FLOW
   ========================================================= */
async function selectSeason(season) {
  state.activeSeason = season;
  state.activeSubView = "standings";
  renderSeasonNav();

  const entry = state.seasons.find(s => s.season === season);
  renderSeasonSubNav(entry);

  if (state.cache[season]) {
    renderStandings(season, state.cache[season], state.cache[season].__source);
    if (season === state.seasons[state.seasons.length - 1].season) renderScoreboard(season, state.cache[season]);
    return;
  }

  document.getElementById("content").innerHTML = `<div class="loading-row">Loading ${season}&hellip;</div>`;

  let teams = null;
  if (entry.source === "sleeper") {
    teams = await computeSleeperStandings(entry);
  } else if (entry.source === "historical") {
    teams = getHistoricalStandings(season);
  }

  if (teams) teams.__source = entry.source;
  state.cache[season] = teams || [];
  state.cache[season].__source = entry.source;

  renderStandings(season, teams, entry.source);
}

function renderSeasonSubNav(entry) {
  const nav = document.getElementById("seasonSubNav");
  if (!entry || entry.source !== "sleeper") {
    nav.innerHTML = "";
    return;
  }
  const tabs = [
    { key: "standings", label: "Standings" },
    { key: "draft", label: "Draft Recap" },
    { key: "power", label: "Power Rankings" },
    { key: "playoff", label: "Playoff Picture" }
  ];
  nav.innerHTML = tabs.map(t =>
    `<button class="sub-tab-btn${t.key === state.activeSubView ? " active" : ""}" data-sub="${t.key}">${t.label}</button>`
  ).join("");
  nav.querySelectorAll(".sub-tab-btn").forEach(btn => {
    btn.addEventListener("click", () => selectSubView(entry, btn.dataset.sub));
  });
}

async function selectSubView(entry, view) {
  state.activeSubView = view;
  renderSeasonSubNav(entry);

  const content = document.getElementById("content");
  const season = entry.season;

  if (view === "standings") {
    const teams = state.cache[season];
    renderStandings(season, teams, entry.source);
    return;
  }
  if (view === "draft") {
    content.innerHTML = `<div class="loading-row">Loading draft board&hellip;</div>`;
    await renderDraftRecap(entry);
    return;
  }
  if (view === "power") {
    content.innerHTML = `<div class="loading-row">Crunching weekly scores&hellip;</div>`;
    await renderInSeasonPowerRankings(entry);
    return;
  }
  if (view === "playoff") {
    content.innerHTML = `<div class="loading-row">Checking the standings&hellip;</div>`;
    await renderPlayoffPicture(entry);
    return;
  }
}

/* =========================================================
   HISTORICAL STATS
   ========================================================= */
async function ensureAllSeasonsLoaded() {
  for (const entry of state.seasons) {
    if (state.cache[entry.season]) continue;
    let teams = null;
    if (entry.source === "sleeper") {
      teams = await computeSleeperStandings(entry);
    } else if (entry.source === "historical") {
      teams = getHistoricalStandings(entry.season);
    }
    state.cache[entry.season] = teams || [];
    state.cache[entry.season].__source = entry.source;
  }
}

// Total seasons the league has existed, counting back to the
// earliest tracked year. Every manager is treated as having been
// around for all of them, even though full stats are only on record
// from 2020 onward — the current season is excluded until Sleeper
// marks the league complete, so this doesn't tick up until the
// season actually finishes.
function computeLeagueTenure() {
  const sleeperEntries = state.seasons.filter(s => s.source === "sleeper");
  const latest = sleeperEntries[sleeperEntries.length - 1];
  const currentInProgress = latest && latest.leagueMeta && latest.leagueMeta.status && latest.leagueMeta.status !== "complete";
  return state.seasons.length - (currentInProgress ? 1 : 0);
}

function buildAllTimeRecordTable() {
  const records = {};
  Object.entries(CAREER_RECORD_2020_2025).forEach(([owner, r]) => {
    records[owner] = { owner, wins: r.wins, losses: r.losses, ties: r.ties };
  });

  // Only seasons after 2025 get added from Sleeper — 2020-2025 already
  // comes from the spreadsheet total above, so pulling those years from
  // Sleeper too would double-count them.
  state.seasons
    .filter(s => s.season > 2025 && s.source === "sleeper")
    .forEach(entry => {
      const teams = state.cache[entry.season];
      if (!teams) return;
      teams.forEach(t => {
        if (!records[t.owner]) records[t.owner] = { owner: t.owner, wins: 0, losses: 0, ties: 0 };
        records[t.owner].wins += (t.wins || 0);
        records[t.owner].losses += (t.losses || 0);
        records[t.owner].ties += (t.ties || 0);
      });
    });

  return Object.values(records).map(r => {
    const games = r.wins + r.losses + r.ties;
    return { ...r, winPct: games ? (r.wins + r.ties * 0.5) / games : 0 };
  }).sort((a, b) => b.winPct - a.winPct);
}

function buildCareerAggregates() {
  const byOwner = {}; // owner -> { seasons: [{season, rank, pointsFor, pointsAgainst}], titles: [] }

  const ensure = (owner) => {
    if (!byOwner[owner]) byOwner[owner] = { owner, seasons: [], titles: [] };
    return byOwner[owner];
  };

  state.seasons.forEach(entry => {
    const teams = state.cache[entry.season];
    if (teams && teams.length) {
      teams.forEach((t, i) => {
        const rec = ensure(t.owner);
        rec.seasons.push({
          season: entry.season,
          rank: t.rank != null ? t.rank : (i + 1),
          pointsFor: t.pointsFor,
          pointsAgainst: t.pointsAgainst
        });
      });
    }
  });

  // Championship-only years (no team-level rank/points data, e.g.
  // 2018-2019) still count as a 1st-place finish for whoever won it —
  // otherwise winning it all in a year we have no team data for
  // wouldn't show up in that person's best/worst finish at all.
  Object.keys(CHAMPIONS).forEach(yr => {
    const year = parseInt(yr, 10);
    const owner = CHAMPIONS[yr];
    const rec = ensure(owner);
    rec.titles.push(year);
    const alreadyTracked = rec.seasons.some(s => s.season === year);
    if (!alreadyTracked) {
      rec.seasons.push({ season: year, rank: 1, pointsFor: null, pointsAgainst: null });
    }
  });

  return Object.values(byOwner);
}

function renderHistoryView() {
  return ensureAllSeasonsLoaded().then(() => {
    const careers = buildCareerAggregates();
    const records = buildAllTimeRecordTable();

    // ---- Championships ----
    const champs = careers
      .filter(c => c.titles.length)
      .sort((a, b) => b.titles.length - a.titles.length || Math.min(...a.titles) - Math.min(...b.titles));

    // ---- Career scoring (only average over seasons with real points data) ----
    const scoring = careers.filter(c => c.seasons.some(s => s.pointsFor != null)).map(c => {
      const withPts = c.seasons.filter(s => s.pointsFor != null);
      const n = withPts.length;
      const avgFor = withPts.reduce((s, x) => s + x.pointsFor, 0) / n;
      const avgAgainst = withPts.reduce((s, x) => s + x.pointsAgainst, 0) / n;
      return { owner: c.owner, seasons: c.seasons.length, avgFor, avgAgainst, avgDiff: avgFor - avgAgainst };
    });
    const byAvgAgainst = scoring.slice().sort((a, b) => b.avgAgainst - a.avgAgainst);

    // ---- Career average finish (needs rank data) ----
    const finish = careers.filter(c => c.seasons.length).map(c => {
      const ranks = c.seasons.map(x => x.rank);
      const avg = ranks.reduce((s, r) => s + r, 0) / ranks.length;
      return { owner: c.owner, avg, best: Math.min(...ranks), worst: Math.max(...ranks) };
    }).sort((a, b) => a.avg - b.avg);

    // ---- Merge win-loss + scoring + finish into one condensed Career Stats table ----
    const recordMap = {}; records.forEach(r => recordMap[r.owner] = r);
    const scoringMap = {}; scoring.forEach(s => scoringMap[s.owner] = s);
    const finishMap = {}; finish.forEach(f => finishMap[f.owner] = f);
    const titleMap = {}; champs.forEach(c => titleMap[c.owner] = c.titles.length);

    const allOwners = new Set([...records.map(r => r.owner), ...scoring.map(s => s.owner)]);
    const leagueTenure = computeLeagueTenure();
    const careerStats = Array.from(allOwners).map(owner => {
      const r = recordMap[owner] || { wins: 0, losses: 0, ties: 0, winPct: 0 };
      const s = scoringMap[owner] || { seasons: 0, avgFor: null, avgAgainst: null, avgDiff: null };
      const f = finishMap[owner] || { avg: null, best: null, worst: null };
      return {
        owner, wins: r.wins, losses: r.losses, ties: r.ties, winPct: r.winPct,
        seasons: leagueTenure, avgFor: s.avgFor, avgAgainst: s.avgAgainst, avgDiff: s.avgDiff,
        avgFinish: f.avg, bestFinish: f.best, worstFinish: f.worst, titles: titleMap[owner] || 0
      };
    });

    // ---- Total career points scored (sum, not average) ----
    const totalPointsMap = {};
    careers.forEach(c => {
      totalPointsMap[c.owner] = c.seasons
        .filter(s => s.pointsFor != null)
        .reduce((sum, s) => sum + s.pointsFor, 0);
    });

    // ---- All-Time Power Rankings ----
    // Blends career win %, championships, average finish, total points
    // scored, and point differential into a single 0-100 score. Each
    // factor is min-max normalized across the league first, so no
    // single stat's raw scale (e.g. points in the thousands vs a
    // 0-2 title count) can dominate just because its numbers are bigger.
    const POWER_WEIGHTS = { winPct: 0.25, titles: 0.25, avgFinish: 0.25, totalPoints: 0.15, avgDiff: 0.10 };
    const normalize = (value, min, max, invert) => {
      if (max === min) return 100;
      let n = (value - min) / (max - min) * 100;
      return invert ? 100 - n : n;
    };
    const rangeOf = arr => ({ min: Math.min(...arr), max: Math.max(...arr) });

    const powerInputs = careerStats.map(r => ({
      owner: r.owner,
      winPct: r.winPct,
      titles: r.titles,
      avgFinish: r.avgFinish,
      totalPoints: totalPointsMap[r.owner] || 0,
      avgDiff: r.avgDiff != null ? r.avgDiff : 0
    }));
    const wpRange = rangeOf(powerInputs.map(p => p.winPct));
    const titleRange = rangeOf(powerInputs.map(p => p.titles));
    const finishRange = rangeOf(powerInputs.map(p => p.avgFinish != null ? p.avgFinish : 0));
    const ptsRange = rangeOf(powerInputs.map(p => p.totalPoints));
    const diffRange = rangeOf(powerInputs.map(p => p.avgDiff));

    const powerRankings = powerInputs.map(p => {
      const winPctScore = normalize(p.winPct, wpRange.min, wpRange.max);
      const titlesScore = normalize(p.titles, titleRange.min, titleRange.max);
      const finishScore = p.avgFinish != null ? normalize(p.avgFinish, finishRange.min, finishRange.max, true) : 0;
      const pointsScore = normalize(p.totalPoints, ptsRange.min, ptsRange.max);
      const diffScore = normalize(p.avgDiff, diffRange.min, diffRange.max);
      const powerScore =
        winPctScore * POWER_WEIGHTS.winPct +
        titlesScore * POWER_WEIGHTS.titles +
        finishScore * POWER_WEIGHTS.avgFinish +
        pointsScore * POWER_WEIGHTS.totalPoints +
        diffScore * POWER_WEIGHTS.avgDiff;
      return { ...p, powerScore };
    }).sort((a, b) => b.powerScore - a.powerScore);


    let bestSingleSeason = null, worstSingleSeasonAgainst = null;
    careers.forEach(c => c.seasons.forEach(s => {
      if (s.pointsFor != null && (!bestSingleSeason || s.pointsFor > bestSingleSeason.pointsFor)) {
        bestSingleSeason = { owner: c.owner, season: s.season, pointsFor: s.pointsFor };
      }
      if (s.pointsAgainst != null && (!worstSingleSeasonAgainst || s.pointsAgainst > worstSingleSeasonAgainst.pointsAgainst)) {
        worstSingleSeasonAgainst = { owner: c.owner, season: s.season, pointsAgainst: s.pointsAgainst };
      }
    }));

    const maxTitleCount = champs.length ? champs[0].titles.length : 0;
    const coChamps = champs.filter(c => c.titles.length === maxTitleCount);
    const mostTitlesCard = coChamps.length ? {
      label: "Most Championships",
      name: coChamps.map(c => c.owner).join(", "),
      detail: `${maxTitleCount} title${maxTitleCount !== 1 ? "s" : ""} each`
    } : null;
    const bestAvgFinish = finish[0];
    const worstAvgFinish = finish[finish.length - 1];
    const mostPointsAgainstCareer = byAvgAgainst[0];
    const bestWinPct = records[0];

    const goat = powerRankings[0];

    const cards = [
      goat && { label: "\uD83D\uDC51 All-Time Power Ranking #1", name: goat.owner, detail: `Power Score: ${goat.powerScore.toFixed(1)} / 100`, highlight: true },
      mostTitlesCard,
      bestWinPct && { label: "Best All-Time Win %", name: bestWinPct.owner, detail: `${bestWinPct.wins}-${bestWinPct.losses}${bestWinPct.ties ? "-" + bestWinPct.ties : ""} (${(bestWinPct.winPct*100).toFixed(1)}%)` },
      bestSingleSeason && { label: "Highest Single-Season Points", name: bestSingleSeason.owner, detail: `${bestSingleSeason.pointsFor.toFixed(1)} pts in ${bestSingleSeason.season}` },
      worstSingleSeasonAgainst && { label: "Most Points Given Up, One Season", name: worstSingleSeasonAgainst.owner, detail: `${worstSingleSeasonAgainst.pointsAgainst.toFixed(1)} pts in ${worstSingleSeasonAgainst.season}` },
      bestAvgFinish && { label: "Best Career Average Finish", name: bestAvgFinish.owner, detail: `Avg finish: ${bestAvgFinish.avg.toFixed(2)}` },
      worstAvgFinish && { label: "Worst Career Average Finish", name: worstAvgFinish.owner, detail: `Avg finish: ${worstAvgFinish.avg.toFixed(2)}` },
      mostPointsAgainstCareer && { label: "Toughest Schedule, Career", name: mostPointsAgainstCareer.owner, detail: `${mostPointsAgainstCareer.avgAgainst.toFixed(1)} pts against / season` }
    ].filter(Boolean);

    const cardsHTML = cards.map(c => `
      <div class="record-card${c.highlight ? " record-card-highlight" : ""}">
        <div class="rc-label">${escapeHTML(c.label)}</div>
        <div class="rc-name">${escapeHTML(c.name)}</div>
        <div class="rc-detail">${escapeHTML(c.detail)}</div>
      </div>`).join("");

    document.getElementById("historyContent").innerHTML = `
      <div class="record-grid">${cardsHTML}</div>

      <div class="hist-section">
        <h2 class="hist-section-head">All-Time Power Rankings</h2>
        <p class="hist-section-sub">One score (0&ndash;100) blending career win % (25%), championships (25%), average finish (25%), total points scored (15%), and point differential (10%). Each factor is scaled against the rest of the league first, so titles carry as much weight as their share says, not just whichever number happens to be bigger.</p>
        <div class="table-scroll" id="powerRankTable"></div>
      </div>

      <div class="hist-section">
        <h2 class="hist-section-head">Career Stats</h2>
        <p class="hist-section-sub">All-time record, scoring, and finish &mdash; click any column to sort. 2020&ndash;2025 record comes from league history, current season added on top; avg finish/scoring covers 2020&ndash;present.</p>
        <div class="table-scroll" id="careerStatsTable"></div>
      </div>

      <div class="hist-section">
        <h2 class="hist-section-head">Championships</h2>
        <p class="hist-section-sub">Every title on record &mdash; who hoisted it, and when.</p>
        <div class="table-scroll" id="championshipsTable"></div>
      </div>
    `;

    paintSortableTable(
      document.getElementById("powerRankTable"),
      [
        { key: "owner", label: "Owner" },
        { key: "powerScore", label: "Power Score", numeric: true },
        { key: "winPct", label: "Win %", numeric: true },
        { key: "titles", label: "\uD83C\uDFC6", numeric: true },
        { key: "avgFinish", label: "Avg Finish", numeric: true },
        { key: "totalPoints", label: "Total Pts", numeric: true },
        { key: "avgDiff", label: "Avg Diff", numeric: true }
      ],
      powerRankings,
      (p, i) => `
        <tr>
          <td class="rank">${i === 0 ? "\uD83D\uDC51" : i + 1}</td>
          <td class="team-name">${escapeHTML(p.owner)}</td>
          <td class="num" style="color: var(--amber); font-family: 'IBM Plex Mono', monospace;">${p.powerScore.toFixed(1)}</td>
          <td class="num">${(p.winPct * 100).toFixed(1)}%</td>
          <td class="num">${p.titles ? `\uD83C\uDFC6&times;${p.titles}` : "\u2014"}</td>
          <td class="num">${p.avgFinish != null ? p.avgFinish.toFixed(2) : "\u2014"}</td>
          <td class="num">${p.totalPoints.toFixed(0)}</td>
          <td class="num ${p.avgDiff >= 0 ? "record-w" : "record-l"}">${p.avgDiff >= 0 ? "+" : ""}${p.avgDiff.toFixed(1)}</td>
        </tr>`,
      "powerScore", "desc"
    );

    paintSortableTable(
      document.getElementById("careerStatsTable"),
      [
        { key: "owner", label: "Owner" },
        { key: "titles", label: "\uD83C\uDFC6", numeric: true },
        { key: "wins", label: "Record", numeric: true },
        { key: "winPct", label: "Win %", numeric: true },
        { key: "seasons", label: "Seasons", numeric: true },
        { key: "avgFor", label: "Avg PF", numeric: true },
        { key: "avgAgainst", label: "Avg PA", numeric: true },
        { key: "avgDiff", label: "Avg Diff", numeric: true },
        { key: "avgFinish", label: "Avg Finish", numeric: true },
        { key: "bestFinish", label: "Best", numeric: true },
        { key: "worstFinish", label: "Worst", numeric: true }
      ],
      careerStats,
      (r, i) => `
        <tr>
          <td class="rank">${i + 1}</td>
          <td class="team-name">${escapeHTML(r.owner)}</td>
          <td class="num">${r.titles ? `\uD83C\uDFC6&times;${r.titles}` : "\u2014"}</td>
          <td class="num"><span class="record-w">${r.wins}</span>-<span class="record-l">${r.losses}</span>${r.ties ? "-" + r.ties : ""}</td>
          <td class="num">${(r.winPct * 100).toFixed(1)}%</td>
          <td class="num">${r.seasons || "\u2014"}</td>
          <td class="num">${r.avgFor != null ? r.avgFor.toFixed(1) : "\u2014"}</td>
          <td class="num">${r.avgAgainst != null ? r.avgAgainst.toFixed(1) : "\u2014"}</td>
          <td class="num ${r.avgDiff != null ? (r.avgDiff >= 0 ? "record-w" : "record-l") : ""}">${r.avgDiff != null ? ((r.avgDiff >= 0 ? "+" : "") + r.avgDiff.toFixed(1)) : "\u2014"}</td>
          <td class="num">${r.avgFinish != null ? r.avgFinish.toFixed(2) : "\u2014"}</td>
          <td class="num">${r.bestFinish != null ? r.bestFinish : "\u2014"}</td>
          <td class="num">${r.worstFinish != null ? r.worstFinish : "\u2014"}</td>
        </tr>`,
      "winPct", "desc"
    );

    paintSortableTable(
      document.getElementById("championshipsTable"),
      [
        { key: "owner", label: "Owner" },
        { key: "titleCount", label: "Titles", numeric: true },
        { key: "yearsStr", label: "Years" }
      ],
      champs.map(c => ({ owner: c.owner, titleCount: c.titles.length, yearsStr: c.titles.slice().sort((a,b)=>a-b).join(", ") })),
      (c, i) => `
        <tr>
          <td class="rank">${i + 1}</td>
          <td class="team-name">${escapeHTML(c.owner)}</td>
          <td class="num"><span class="trophy-count">\uD83C\uDFC6 &times; ${c.titleCount}</span></td>
          <td class="years-list">${c.yearsStr}</td>
        </tr>`,
      "titleCount", "desc"
    );
  });
}


async function init() {
  try {
    state.seasons = await buildSeasonChain();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="placeholder-box"><strong>Couldn't reach Sleeper</strong>Check your connection and reload the page.</div>`;
    return;
  }

  const sleeperEntries = state.seasons.filter(s => s.source === "sleeper");
  const latest = sleeperEntries[sleeperEntries.length - 1];

  if (latest) {
    document.getElementById("leagueName").textContent = latest.leagueMeta.name || "League HQ";
    document.getElementById("leagueSub").textContent = `${state.seasons[0].season}\u2013${latest.season} \u00b7 ${sleeperEntries.length} season${sleeperEntries.length !== 1 ? "s" : ""} on Sleeper`;
  }

  renderSeasonNav();

  if (latest) {
    await selectSeason(latest.season);
    const teams = state.cache[latest.season];
    renderScoreboard(latest.season, teams);
  } else if (state.seasons.length) {
    await selectSeason(state.seasons[state.seasons.length - 1].season);
  }
}

init();
</script>
