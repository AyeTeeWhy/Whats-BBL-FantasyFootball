/* =========================================================
   HISTORICAL STATS
   ========================================================= */
async function ensureAllSeasonsLoaded() {
  for (const entry of state.seasons) {
    if (state.cache[entry.season]) continue;
    let teams = null;
    if (entry.source === "sleeper") {
      teams = await computeSleeperStandings(entry);
    } else if (entry.source === "historical") {
      teams = getHistoricalStandings(entry.season);
    }
    state.cache[entry.season] = teams || [];
    state.cache[entry.season].__source = entry.source;
  }
}

// Total seasons the league has existed, counting back to the
// earliest tracked year. Every manager is treated as having been
// around for all of them, even though full stats are only on record
// from 2020 onward — the current season is excluded until Sleeper
// marks the league complete, so this doesn't tick up until the
// season actually finishes.
function computeLeagueTenure() {
  const sleeperEntries = state.seasons.filter(s => s.source === "sleeper");
  const latest = sleeperEntries[sleeperEntries.length - 1];
  const currentInProgress = latest && latest.leagueMeta && latest.leagueMeta.status && latest.leagueMeta.status !== "complete";
  return state.seasons.length - (currentInProgress ? 1 : 0);
}

function buildPlayoffAppearances(careers) {
  // Figure out how many teams made the playoffs in each season. Real
  // Sleeper seasons carry their own actual setting; historical seasons
  // use the league's known historical value if there is one, and
  // otherwise fall back to whatever the league's current Sleeper
  // playoff_teams setting is (format rarely changes year to year).
  const sleeperEntries = state.seasons.filter(s => s.source === "sleeper" && s.leagueMeta && s.leagueMeta.settings);
  const liveFallback = sleeperEntries.length ? getPlayoffSpots(sleeperEntries[sleeperEntries.length - 1]) : null;

  const spotsForSeason = {};
  state.seasons.forEach(entry => {
    let spots = null;
    if (entry.source === "sleeper" && entry.leagueMeta && entry.leagueMeta.settings) {
      spots = getPlayoffSpots(entry);
    } else if (CONFIG.historicalPlayoffSpots != null) {
      spots = CONFIG.historicalPlayoffSpots;
    } else {
      spots = liveFallback;
    }
    spotsForSeason[entry.season] = spots;
  });

  const results = {};
  careers.forEach(c => {
    let made = 0, known = 0;
    c.seasons.forEach(s => {
      const spots = spotsForSeason[s.season];
      if (spots == null || s.rank == null) return;
      known++;
      if (s.rank <= spots) made++;
    });
    results[c.owner] = { made, known };
  });
  return results;
}

function buildAllTimeRecordTable(careers) {
  const records = {};
  const overrideYears = new Set(CONFIG.overrideYears || []);

  // A league can supply a cumulative override table for years where
  // only a combined win/loss total was available (no per-season
  // split) -- those years are skipped in the per-season sum below so
  // they aren't double-counted. Leagues with full per-season records
  // for every year (no override) just sum everything directly.
  Object.entries(CAREER_RECORD_OVERRIDE || {}).forEach(([owner, r]) => {
    records[owner] = { owner, wins: r.wins, losses: r.losses, ties: r.ties };
  });

  careers.forEach(c => {
    if (!records[c.owner]) records[c.owner] = { owner: c.owner, wins: 0, losses: 0, ties: 0 };
    c.seasons.forEach(s => {
      if (overrideYears.has(s.season)) return;
      if (s.wins == null) return; // synthetic champion-only entry, no record known
      records[c.owner].wins += s.wins;
      records[c.owner].losses += (s.losses || 0);
      records[c.owner].ties += (s.ties || 0);
    });
  });

  return Object.values(records).map(r => {
    const games = r.wins + r.losses + r.ties;
    return { ...r, winPct: games ? (r.wins + r.ties * 0.5) / games : 0 };
  }).sort((a, b) => b.winPct - a.winPct);
}

function buildCareerAggregates() {
  const byOwner = {}; // owner -> { seasons: [{season, rank, pointsFor, pointsAgainst, wins, losses, ties}], titles: [] }

  const ensure = (owner) => {
    if (!byOwner[owner]) byOwner[owner] = { owner, seasons: [], titles: [] };
    return byOwner[owner];
  };

  state.seasons.forEach(entry => {
    const teams = state.cache[entry.season];
    if (teams && teams.length) {
      teams.forEach((t, i) => {
        const rec = ensure(t.owner);
        rec.seasons.push({
          season: entry.season,
          rank: t.rank != null ? t.rank : (i + 1),
          pointsFor: t.pointsFor,
          pointsAgainst: t.pointsAgainst,
          wins: t.wins, losses: t.losses, ties: t.ties
        });
      });
    }
  });

  // Championship-only years (no team-level rank/points data, e.g.
  // 2018-2019) still count as a 1st-place finish for whoever won it —
  // otherwise winning it all in a year we have no team data for
  // wouldn't show up in that person's best/worst finish at all.
  Object.keys(CHAMPIONS).forEach(yr => {
    const year = parseInt(yr, 10);
    const owner = CHAMPIONS[yr];
    const rec = ensure(owner);
    rec.titles.push(year);
    const alreadyTracked = rec.seasons.some(s => s.season === year);
    if (!alreadyTracked) {
      rec.seasons.push({ season: year, rank: 1, pointsFor: null, pointsAgainst: null });
    }
  });

  return Object.values(byOwner);
}

/* =========================================================
   PROFITS (BBL buy-in + prize payouts)
   ========================================================= */
// Reads 1st/2nd/3rd from Sleeper's playoff bracket for a finished
// season. Returns null if the bracket can't be read, so the caller
// just leaves 2nd/3rd blank instead of guessing.
async function fetchBracketPodium(entry) {
  if (state.podium[entry.season]) return state.podium[entry.season];
  try {
    const [bracket, users, rosters] = await Promise.all([
      getJSON(`${API}/league/${entry.leagueId}/winners_bracket`),
      getJSON(`${API}/league/${entry.leagueId}/users`),
      getJSON(`${API}/league/${entry.leagueId}/rosters`)
    ]);
    if (!Array.isArray(bracket)) return null;
    const finalGame = bracket.find(m => m.p === 1);
    const thirdGame = bracket.find(m => m.p === 3);
    if (!finalGame || finalGame.w == null || finalGame.l == null) return null;
    const userMap = {};
    users.forEach(u => { userMap[u.user_id] = u; });
    const ownerOf = rid => {
      const r = rosters.find(x => x.roster_id === rid);
      const u = r && userMap[r.owner_id];
      return u ? canonicalOwner(u.display_name) : null;
    };
    const podium = {
      first: ownerOf(finalGame.w),
      second: ownerOf(finalGame.l),
      third: thirdGame && thirdGame.w != null ? ownerOf(thirdGame.w) : null
    };
    state.podium[entry.season] = podium;
    return podium;
  } catch (e) {
    return null;
  }
}

async function resolvePodium(year) {
  const manual = (CONFIG.prizes.podium && CONFIG.prizes.podium[year]) || {};
  let second = manual.second || null;
  let third = manual.third || null;
  let conflict = null;
  if (!(second && third)) {
    const entry = state.seasons.find(s => s.season === year && s.source === "sleeper" && s.leagueId);
    if (entry) {
      const b = await fetchBracketPodium(entry);
      // Only trust the bracket if its champion matches the champion
      // already on record for that year.
      if (b && b.first === CHAMPIONS[year]) {
        second = second || b.second;
        third = third || b.third;
      } else if (b && b.first) {
        conflict = b.first;
      }
    }
  }
  return { first: CHAMPIONS[year], second, third, conflict };
}

const fmtMoney = n => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-US");

function computeProfits(careers, podiums) {
  const P = CONFIG.prizes;
  const years = Object.keys(CHAMPIONS).map(Number).sort((a, b) => a - b);
  const pot = P.teams * P.fee;
  const amt = {
    first: pot * P.shares.first, second: pot * P.shares.second,
    third: pot * P.shares.third, high: pot * P.shares.highPoints
  };

  const conflicts = [];
  const seasonRows = years.map(y => {
    let hi = null;
    const fixed = P.topScorer && P.topScorer[y];
    if (fixed) {
      hi = { owner: fixed.owner, pts: fixed.points };
    } else {
      careers.forEach(c => c.seasons.forEach(s => {
        if (s.season === y && s.pointsFor != null && (!hi || s.pointsFor > hi.pts)) hi = { owner: c.owner, pts: s.pointsFor };
      }));
    }
    const pod = podiums[y] || {};
    if (pod.conflict) conflicts.push({ year: y, listed: pod.first, bracket: pod.conflict });
    return { year: y, first: pod.first || null, second: pod.second || null, third: pod.third || null, high: hi ? hi.owner : null, highPts: hi ? hi.pts : null };
  });

  const byOwner = {};
  const ensure = o => (byOwner[o] = byOwner[o] || { owner: o, firsts: 0, seconds: 0, thirds: 0, highs: 0, winnings: 0, paidIn: 0, net: 0 });
  careers.forEach(c => {
    const o = ensure(c.owner);
    o.paidIn = P.fee * (CONFIG.uniformTenure ? years.length : c.seasons.filter(s => years.includes(s.season)).length);
  });

  let unattributed = 0;
  const missing = { podium: [], high: [] };
  seasonRows.forEach(r => {
    if (r.first) { const o = ensure(r.first); o.firsts++; o.winnings += amt.first; } else unattributed += amt.first;
    if (r.second) { const o = ensure(r.second); o.seconds++; o.winnings += amt.second; } else { unattributed += amt.second; missing.podium.push(r.year); }
    if (r.third) { const o = ensure(r.third); o.thirds++; o.winnings += amt.third; } else { unattributed += amt.third; if (!missing.podium.includes(r.year)) missing.podium.push(r.year); }
    if (r.high) { const o = ensure(r.high); o.highs++; o.winnings += amt.high; } else { unattributed += amt.high; missing.high.push(r.year); }
  });
  Object.values(byOwner).forEach(o => { o.net = o.winnings - o.paidIn; });

  return { pot, amt, years, seasonRows, owners: Object.values(byOwner), unattributed, missing, conflicts };
}

async function paintProfits(careers) {
  const leagueKey = ACTIVE_LEAGUE_KEY;
  const P = CONFIG.prizes;
  const years = Object.keys(CHAMPIONS).map(Number);
  const podiums = {};
  await Promise.all(years.map(async y => { podiums[y] = await resolvePodium(y); }));

  const summaryEl = document.getElementById("profitsSummary");
  const tableEl = document.getElementById("profitsTable");
  const seasonEl = document.getElementById("payoutsTable");
  if (leagueKey !== ACTIVE_LEAGUE_KEY || !summaryEl || !tableEl || !seasonEl) return;

  const d = computeProfits(careers, podiums);
  const paidOut = d.pot * d.years.length - d.unattributed;
  const list = a => a.join(", ");
  const notes = [];
  if (d.missing.podium.length) notes.push(`2nd/3rd place not on record for ${list(d.missing.podium)}`);
  if (d.missing.high.length) notes.push(`top scorer not on record for ${list(d.missing.high)}`);

  summaryEl.innerHTML = `
    <div class="prize-summary">
      ${fmtMoney(P.fee)} buy-in &times; ${P.teams} teams = <b>${fmtMoney(d.pot)}</b> pot each season &middot;
      1st <b>${fmtMoney(d.amt.first)}</b> &middot; 2nd <b>${fmtMoney(d.amt.second)}</b> &middot;
      3rd <b>${fmtMoney(d.amt.third)}</b> &middot; most points <b>${fmtMoney(d.amt.high)}</b><br>
      ${d.years.length} seasons played: <b>${fmtMoney(d.pot * d.years.length)}</b> in, <b>${fmtMoney(paidOut)}</b> credited to winners below${d.unattributed ? `, <b>${fmtMoney(d.unattributed)}</b> not attributed (${escapeHTML(notes.join("; "))})` : ""}.
      Net = winnings minus ${fmtMoney(P.fee)} &times; ${d.years.length} seasons.
      ${d.conflicts.length ? `<br><b>Check:</b> Sleeper's bracket shows a different champion than the champions list for ${d.conflicts.map(c => `${c.year} (${escapeHTML(c.bracket)} vs ${escapeHTML(c.listed)})`).join(", ")}, so 2nd/3rd place aren't filled in for those years.` : ""}
    </div>`;

  paintSortableTable(
    tableEl,
    [
      { key: "owner", label: "Owner" },
      { key: "firsts", label: "1st", numeric: true },
      { key: "seconds", label: "2nd", numeric: true },
      { key: "thirds", label: "3rd", numeric: true },
      { key: "highs", label: "Top Pts", numeric: true },
      { key: "winnings", label: "Won", numeric: true },
      { key: "paidIn", label: "Paid In", numeric: true },
      { key: "net", label: "Net", numeric: true }
    ],
    d.owners,
    (o, i) => `
      <tr>
        <td class="rank">${i + 1}</td>
        <td class="team-name">${escapeHTML(o.owner)}</td>
        <td class="num">${o.firsts || "—"}</td>
        <td class="num">${o.seconds || "—"}</td>
        <td class="num">${o.thirds || "—"}</td>
        <td class="num">${o.highs || "—"}</td>
        <td class="num">${fmtMoney(o.winnings)}</td>
        <td class="num">${fmtMoney(o.paidIn)}</td>
        <td class="num ${o.net >= 0 ? "money-pos" : "money-neg"}">${o.net > 0 ? "+" : ""}${fmtMoney(o.net)}</td>
      </tr>`,
    "net", "desc"
  );

  const cell = (name, money, extra) => name
    ? `<td class="prize-cell">${escapeHTML(name)}<small>${fmtMoney(money)}${extra ? " · " + extra : ""}</small></td>`
    : `<td class="prize-cell empty">—</td>`;
  paintSortableTable(
    seasonEl,
    [
      { key: "year", label: "Season", numeric: true },
      { key: "first", label: "1st" },
      { key: "second", label: "2nd" },
      { key: "third", label: "3rd" },
      { key: "high", label: "Most Points" }
    ],
    d.seasonRows,
    (r) => `
      <tr>
        <td class="rank"></td>
        <td class="num">${r.year}</td>
        ${cell(r.first, d.amt.first)}
        ${cell(r.second, d.amt.second)}
        ${cell(r.third, d.amt.third)}
        ${cell(r.high, d.amt.high, r.highPts != null ? r.highPts.toFixed(1) + " pts" : "")}
      </tr>`,
    "year", "desc"
  );
}

function renderHistoryView() {
  return ensureAllSeasonsLoaded().then(() => {
    const careers = buildCareerAggregates();
    const records = buildAllTimeRecordTable(careers);

    // ---- Championships ----
    const champs = careers
      .filter(c => c.titles.length)
      .sort((a, b) => b.titles.length - a.titles.length || Math.min(...a.titles) - Math.min(...b.titles));

    // ---- Career scoring (only average over seasons with real points data) ----
    const scoring = careers.filter(c => c.seasons.some(s => s.pointsFor != null)).map(c => {
      const withPts = c.seasons.filter(s => s.pointsFor != null);
      const n = withPts.length;
      const avgFor = withPts.reduce((s, x) => s + x.pointsFor, 0) / n;
      const avgAgainst = withPts.reduce((s, x) => s + x.pointsAgainst, 0) / n;
      return { owner: c.owner, seasons: c.seasons.length, avgFor, avgAgainst, avgDiff: avgFor - avgAgainst };
    });
    const byAvgAgainst = scoring.slice().sort((a, b) => b.avgAgainst - a.avgAgainst);

    // ---- Career average finish (needs rank data) ----
    const finish = careers.filter(c => c.seasons.length).map(c => {
      const ranks = c.seasons.map(x => x.rank);
      const avg = ranks.reduce((s, r) => s + r, 0) / ranks.length;
      return { owner: c.owner, avg, best: Math.min(...ranks), worst: Math.max(...ranks) };
    }).sort((a, b) => a.avg - b.avg);

    // ---- Merge win-loss + scoring + finish into one condensed Career Stats table ----
    const recordMap = {}; records.forEach(r => recordMap[r.owner] = r);
    const scoringMap = {}; scoring.forEach(s => scoringMap[s.owner] = s);
    const finishMap = {}; finish.forEach(f => finishMap[f.owner] = f);
    const titleMap = {}; champs.forEach(c => titleMap[c.owner] = c.titles.length);

    const allOwners = new Set([...records.map(r => r.owner), ...scoring.map(s => s.owner)]);
    const leagueTenure = computeLeagueTenure();
    const playoffMap = buildPlayoffAppearances(careers);
    const careerStats = Array.from(allOwners).map(owner => {
      const r = recordMap[owner] || { wins: 0, losses: 0, ties: 0, winPct: 0 };
      const s = scoringMap[owner] || { seasons: 0, avgFor: null, avgAgainst: null, avgDiff: null };
      const f = finishMap[owner] || { avg: null, best: null, worst: null };
      const p = playoffMap[owner] || { made: 0, known: 0 };
      // Some leagues have had every member since day one, in which
      // case "seasons" means league tenure; others have had real
      // membership turnover, in which case it should reflect how
      // many seasons that specific person actually played.
      const seasons = CONFIG.uniformTenure ? leagueTenure : s.seasons;
      return {
        owner, wins: r.wins, losses: r.losses, ties: r.ties, winPct: r.winPct,
        seasons, avgFor: s.avgFor, avgAgainst: s.avgAgainst, avgDiff: s.avgDiff,
        avgFinish: f.avg, bestFinish: f.best, worstFinish: f.worst, titles: titleMap[owner] || 0,
        playoffsMade: p.made, playoffsKnown: p.known
      };
    });

    // ---- All-Time Power Rankings ----
    // Blends career win %, championships, average finish, average
    // points scored per season, and point differential into a single
    // 0-100 score. Points and differential are per-season averages
    // rather than career totals -- using totals would unfairly reward
    // or penalize people just for having played more or fewer seasons
    // (e.g. someone who left the league early would look weaker purely
    // for having fewer cumulative points, even with a great average).
    // Each factor is also min-max normalized across the league, so no
    // single stat's raw scale (points in the hundreds vs a 0-2 title
    // count) can dominate just because its numbers are bigger.
    const POWER_WEIGHTS = { winPct: 0.25, titles: 0.25, avgFinish: 0.25, avgPoints: 0.15, avgDiff: 0.10 };
    const normalize = (value, min, max, invert) => {
      if (max === min) return 100;
      let n = (value - min) / (max - min) * 100;
      return invert ? 100 - n : n;
    };
    const rangeOf = arr => ({ min: Math.min(...arr), max: Math.max(...arr) });

    const powerInputs = careerStats.map(r => ({
      owner: r.owner,
      winPct: r.winPct,
      titles: r.titles,
      avgFinish: r.avgFinish,
      avgPoints: r.avgFor != null ? r.avgFor : 0,
      avgDiff: r.avgDiff != null ? r.avgDiff : 0
    }));
    const wpRange = rangeOf(powerInputs.map(p => p.winPct));
    const titleRange = rangeOf(powerInputs.map(p => p.titles));
    const finishRange = rangeOf(powerInputs.map(p => p.avgFinish != null ? p.avgFinish : 0));
    const ptsRange = rangeOf(powerInputs.map(p => p.avgPoints));
    const diffRange = rangeOf(powerInputs.map(p => p.avgDiff));

    const powerRankings = powerInputs.map(p => {
      const winPctScore = normalize(p.winPct, wpRange.min, wpRange.max);
      const titlesScore = normalize(p.titles, titleRange.min, titleRange.max);
      const finishScore = p.avgFinish != null ? normalize(p.avgFinish, finishRange.min, finishRange.max, true) : 0;
      const pointsScore = normalize(p.avgPoints, ptsRange.min, ptsRange.max);
      const diffScore = normalize(p.avgDiff, diffRange.min, diffRange.max);
      const powerScore =
        winPctScore * POWER_WEIGHTS.winPct +
        titlesScore * POWER_WEIGHTS.titles +
        finishScore * POWER_WEIGHTS.avgFinish +
        pointsScore * POWER_WEIGHTS.avgPoints +
        diffScore * POWER_WEIGHTS.avgDiff;
      return { ...p, powerScore };
    }).sort((a, b) => b.powerScore - a.powerScore);


    let bestSingleSeason = null, worstSingleSeasonAgainst = null;
    careers.forEach(c => c.seasons.forEach(s => {
      if (s.pointsFor != null && (!bestSingleSeason || s.pointsFor > bestSingleSeason.pointsFor)) {
        bestSingleSeason = { owner: c.owner, season: s.season, pointsFor: s.pointsFor };
      }
      if (s.pointsAgainst != null && (!worstSingleSeasonAgainst || s.pointsAgainst > worstSingleSeasonAgainst.pointsAgainst)) {
        worstSingleSeasonAgainst = { owner: c.owner, season: s.season, pointsAgainst: s.pointsAgainst };
      }
    }));

    const maxTitleCount = champs.length ? champs[0].titles.length : 0;
    const coChamps = champs.filter(c => c.titles.length === maxTitleCount);
    const mostTitlesCard = coChamps.length ? {
      label: "Most Championships",
      name: coChamps.map(c => c.owner).join(", "),
      detail: `${maxTitleCount} title${maxTitleCount !== 1 ? "s" : ""} each`
    } : null;
    const bestAvgFinish = finish[0];
    const worstAvgFinish = finish[finish.length - 1];
    const mostPointsAgainstCareer = byAvgAgainst[0];
    const bestWinPct = records[0];

    const goat = powerRankings[0];

    const cards = [
      goat && { label: "\uD83D\uDC51 All-Time Power Ranking #1", name: goat.owner, detail: `Power Score: ${goat.powerScore.toFixed(1)} / 100`, highlight: true },
      mostTitlesCard,
      bestWinPct && { label: "Best All-Time Win %", name: bestWinPct.owner, detail: `${bestWinPct.wins}-${bestWinPct.losses}${bestWinPct.ties ? "-" + bestWinPct.ties : ""} (${(bestWinPct.winPct*100).toFixed(1)}%)` },
      bestSingleSeason && { label: "Highest Single-Season Points", name: bestSingleSeason.owner, detail: `${bestSingleSeason.pointsFor.toFixed(1)} pts in ${bestSingleSeason.season}` },
      worstSingleSeasonAgainst && { label: "Most Points Given Up, One Season", name: worstSingleSeasonAgainst.owner, detail: `${worstSingleSeasonAgainst.pointsAgainst.toFixed(1)} pts in ${worstSingleSeasonAgainst.season}` },
      bestAvgFinish && { label: "Best Career Average Finish", name: bestAvgFinish.owner, detail: `Avg finish: ${bestAvgFinish.avg.toFixed(2)}` },
      worstAvgFinish && { label: "Worst Career Average Finish", name: worstAvgFinish.owner, detail: `Avg finish: ${worstAvgFinish.avg.toFixed(2)}` },
      mostPointsAgainstCareer && { label: "Toughest Schedule, Career", name: mostPointsAgainstCareer.owner, detail: `${mostPointsAgainstCareer.avgAgainst.toFixed(1)} pts against / season` }
    ].filter(Boolean);

    const cardsHTML = cards.map(c => `
      <div class="record-card${c.highlight ? " record-card-highlight" : ""}">
        <div class="rc-label">${escapeHTML(c.label)}</div>
        <div class="rc-name">${escapeHTML(c.name)}</div>
        <div class="rc-detail">${escapeHTML(c.detail)}</div>
      </div>`).join("");

    document.getElementById("historyContent").innerHTML = `
      <div class="record-grid">${cardsHTML}</div>

      <div class="hist-section">
        <h2 class="hist-section-head">All-Time Power Rankings</h2>
        <p class="hist-section-sub">One score (0&ndash;100) blending career win % (25%), championships (25%), average finish (25%), average points scored per season (15%), and point differential (10%). Points and differential are per-season averages, not career totals, so someone with fewer seasons in the league isn't penalized just for that.</p>
        <div class="table-scroll" id="powerRankTable"></div>
      </div>

      <div class="hist-section">
        <h2 class="hist-section-head">Career Stats</h2>
        <p class="hist-section-sub">All-time record, scoring, and finish &mdash; click any column to sort. 2020&ndash;2025 record comes from league history, current season added on top; avg finish/scoring covers 2020&ndash;present.</p>
        <div class="table-scroll" id="careerStatsTable"></div>
      </div>

      <div class="hist-section">
        <h2 class="hist-section-head">Championships</h2>
        <p class="hist-section-sub">Every title on record &mdash; who hoisted it, and when.</p>
        <div class="table-scroll" id="championshipsTable"></div>
      </div>

      ${CONFIG.prizes ? `
      <div class="hist-section">
        <h2 class="hist-section-head">Profits</h2>
        <p class="hist-section-sub">Buy-ins, payouts and net winnings by owner &mdash; click any column to sort.</p>
        <div id="profitsSummary"><div class="loading-row">Tallying payouts&hellip;</div></div>
        <div class="table-scroll" id="profitsTable"></div>
        <h3 class="hist-subhead">Payouts by season</h3>
        <div class="table-scroll" id="payoutsTable"></div>
      </div>` : ""}
    `;

    paintSortableTable(
      document.getElementById("powerRankTable"),
      [
        { key: "owner", label: "Owner" },
        { key: "powerScore", label: "Power Score", numeric: true },
        { key: "winPct", label: "Win %", numeric: true },
        { key: "titles", label: "\uD83C\uDFC6", numeric: true },
        { key: "avgFinish", label: "Avg Finish", numeric: true },
        { key: "avgPoints", label: "Avg Pts", numeric: true },
        { key: "avgDiff", label: "Avg Diff", numeric: true }
      ],
      powerRankings,
      (p, i) => `
        <tr>
          <td class="rank">${i === 0 ? "\uD83D\uDC51" : i + 1}</td>
          <td class="team-name">${escapeHTML(p.owner)}</td>
          <td class="num" style="color: var(--amber); font-family: 'IBM Plex Mono', monospace;">${p.powerScore.toFixed(1)}</td>
          <td class="num">${(p.winPct * 100).toFixed(1)}%</td>
          <td class="num">${p.titles ? `\uD83C\uDFC6&times;${p.titles}` : "\u2014"}</td>
          <td class="num">${p.avgFinish != null ? p.avgFinish.toFixed(2) : "\u2014"}</td>
          <td class="num">${p.avgPoints.toFixed(1)}</td>
          <td class="num ${p.avgDiff >= 0 ? "record-w" : "record-l"}">${p.avgDiff >= 0 ? "+" : ""}${p.avgDiff.toFixed(1)}</td>
        </tr>`,
      "powerScore", "desc"
    );

    paintSortableTable(
      document.getElementById("careerStatsTable"),
      [
        { key: "owner", label: "Owner" },
        { key: "titles", label: "\uD83C\uDFC6", numeric: true },
        { key: "playoffsMade", label: "Playoffs", numeric: true },
        { key: "wins", label: "Record", numeric: true },
        { key: "winPct", label: "Win %", numeric: true },
        { key: "seasons", label: "Seasons", numeric: true },
        { key: "avgFor", label: "Avg PF", numeric: true },
        { key: "avgAgainst", label: "Avg PA", numeric: true },
        { key: "avgDiff", label: "Avg Diff", numeric: true },
        { key: "avgFinish", label: "Avg Finish", numeric: true },
        { key: "bestFinish", label: "Best", numeric: true },
        { key: "worstFinish", label: "Worst", numeric: true }
      ],
      careerStats,
      (r, i) => `
        <tr>
          <td class="rank">${i + 1}</td>
          <td class="team-name">${escapeHTML(r.owner)}</td>
          <td class="num">${r.titles ? `\uD83C\uDFC6&times;${r.titles}` : "\u2014"}</td>
          <td class="num">${r.playoffsKnown ? `${r.playoffsMade}/${r.playoffsKnown}` : "\u2014"}</td>
          <td class="num"><span class="record-w">${r.wins}</span>-<span class="record-l">${r.losses}</span>${r.ties ? "-" + r.ties : ""}</td>
          <td class="num">${(r.winPct * 100).toFixed(1)}%</td>
          <td class="num">${r.seasons || "\u2014"}</td>
          <td class="num">${r.avgFor != null ? r.avgFor.toFixed(1) : "\u2014"}</td>
          <td class="num">${r.avgAgainst != null ? r.avgAgainst.toFixed(1) : "\u2014"}</td>
          <td class="num ${r.avgDiff != null ? (r.avgDiff >= 0 ? "record-w" : "record-l") : ""}">${r.avgDiff != null ? ((r.avgDiff >= 0 ? "+" : "") + r.avgDiff.toFixed(1)) : "\u2014"}</td>
          <td class="num">${r.avgFinish != null ? r.avgFinish.toFixed(2) : "\u2014"}</td>
          <td class="num">${r.bestFinish != null ? r.bestFinish : "\u2014"}</td>
          <td class="num">${r.worstFinish != null ? r.worstFinish : "\u2014"}</td>
        </tr>`,
      "winPct", "desc"
    );

    paintSortableTable(
      document.getElementById("championshipsTable"),
      [
        { key: "owner", label: "Owner" },
        { key: "titleCount", label: "Titles", numeric: true },
        { key: "yearsStr", label: "Years" }
      ],
      champs.map(c => ({ owner: c.owner, titleCount: c.titles.length, yearsStr: c.titles.slice().sort((a,b)=>a-b).join(", ") })),
      (c, i) => `
        <tr>
          <td class="rank">${i + 1}</td>
          <td class="team-name">${escapeHTML(c.owner)}</td>
          <td class="num"><span class="trophy-count">\uD83C\uDFC6 &times; ${c.titleCount}</span></td>
          <td class="years-list">${c.yearsStr}</td>
        </tr>`,
      "titleCount", "desc"
    );

    if (CONFIG.prizes) paintProfits(careers);
  });
}


async function switchLeague(key) {
  const league = LEAGUES[key];
  if (!league) return;

  ACTIVE_LEAGUE_KEY = key;
  CONFIG = league;
  HISTORICAL_DATA = league.historicalData;
  CHAMPIONS = league.champions;
  CAREER_RECORD_OVERRIDE = league.careerRecordOverride;
  OWNER_ALIASES = league.ownerAliases;
  applyTheme(key);

  // Reset all per-league state -- everything here is scoped to
  // whichever league is active. state.playersStatic (the big NFL
  // player database) is intentionally NOT reset since it isn't
  // league-specific and is expensive to refetch.
  state.seasons = [];
  state.activeSeason = null;
  state.activeSubView = "standings";
  state.cache = {};
  state.subCache = {};
  state.podium = {};
  historyLoaded = false;

  // Reset the Season Standings / Historical Stats toggle back to
  // Season Standings, and the view panels to match.
  document.querySelectorAll(".toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.view === "season"));
  document.getElementById("seasonView").style.display = "";
  document.getElementById("historyView").style.display = "none";

  document.getElementById("leagueName").textContent = "Loading League\u2026";
  document.getElementById("leagueSub").textContent = "Pulling live data from Sleeper";
  document.getElementById("content").innerHTML = `<div class="loading-row">Fetching standings&hellip;</div>`;
  document.getElementById("seasonSubNav").innerHTML = "";
  document.getElementById("seasonTrack").innerHTML = "";

  await init();
}

function renderLeagueSwitcher() {
  const el = document.getElementById("leagueSwitcher");
  if (!el) return;
  el.innerHTML = Object.values(LEAGUES).map(l =>
    `<option value="${l.key}"${l.key === ACTIVE_LEAGUE_KEY ? " selected" : ""}>${escapeHTML(l.label)}</option>`
  ).join("");
}

async function init() {
  renderLeagueSwitcher();
  try {
    state.seasons = await buildSeasonChain();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="placeholder-box"><strong>Couldn't reach Sleeper</strong>Check your connection and reload the page.</div>`;
    return;
  }

  const sleeperEntries = state.seasons.filter(s => s.source === "sleeper");
  const latest = sleeperEntries[sleeperEntries.length - 1];

  if (latest) {
    document.getElementById("leagueName").textContent = latest.leagueMeta.name || "League HQ";
    document.getElementById("leagueSub").textContent = `${state.seasons[0].season}\u2013${latest.season} \u00b7 ${sleeperEntries.length} season${sleeperEntries.length !== 1 ? "s" : ""} on Sleeper`;
  }

  renderSeasonNav();

  if (latest) {
    await selectSeason(latest.season);
    const teams = state.cache[latest.season];
    renderScoreboard(latest.season, teams);
  } else if (state.seasons.length) {
    await selectSeason(state.seasons[state.seasons.length - 1].season);
  }
}

applyTheme(ACTIVE_LEAGUE_KEY);
init();
document.getElementById("leagueSwitcher").addEventListener("change", (e) => {
  switchLeague(e.target.value);
});
</script>
